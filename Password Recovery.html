<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Custom styles to handle visibility of different sections */
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4 w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-700">Password Recovery</h2>

        <div id="email-verification" class="step active">
            <h3 class="text-lg font-semibold mb-4 text-gray-600">Verify Your Email</h3>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="email">
                    Email Address
                </label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="email" type="email" placeholder="Enter your email">
            </div>
            <div class="flex items-center justify-between">
                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="button" id="verify-email-btn">
                    Verify Email
                </button>
            </div>
            <p id="email-verification-message" class="text-sm mt-2 text-gray-500"></p>
        </div>

        <div id="security-questions" class="step">
            <h3 class="text-lg font-semibold mb-4 text-gray-600">Answer Security Questions</h3>
            <div id="questions-container">
                </div>
            <div class="flex items-center justify-between mt-4">
                <button class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="button" id="prev-question-btn">
                    Previous
                </button>
                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="button" id="submit-answers-btn">
                    Submit Answers
                </button>
            </div>
            <p id="security-questions-message" class="text-sm mt-2 text-gray-500"></p>
        </div>

        <div id="password-reset" class="step">
            <h3 class="text-lg font-semibold mb-4 text-gray-600">Reset Your Password</h3>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="new-password">
                    New Password
                </label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="new-password" type="password" placeholder="Enter new password">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="confirm-password">
                    Confirm New Password
                </label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="confirm-password" type="password" placeholder="Confirm new password">
            </div>
            <div class="flex items-center justify-between mt-4">
                <button class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="button" id="prev-reset-btn">
                    Previous
                </button>
                <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="button" id="reset-password-btn">
                    Reset Password
                </button>
            </div>
            <p id="password-reset-message" class="text-sm mt-2 text-green-500"></p>
        </div>
    </div>

    <script>
        const emailVerificationDiv = document.getElementById('email-verification');
        const securityQuestionsDiv = document.getElementById('security-questions');
        const passwordResetDiv = document.getElementById('password-reset');
        const verifyEmailBtn = document.getElementById('verify-email-btn');
        const submitAnswersBtn = document.getElementById('submit-answers-btn');
        const resetPasswordBtn = document.getElementById('reset-password-btn');
        const prevQuestionBtn = document.getElementById('prev-question-btn');
        const prevResetBtn = document.getElementById('prev-reset-btn');
        const questionsContainer = document.getElementById('questions-container');
        const emailVerificationMessage = document.getElementById('email-verification-message');
        const securityQuestionsMessage = document.getElementById('security-questions-message');
        const passwordResetMessage = document.getElementById('password-reset-message');
        const emailInput = document.getElementById('email');
        const newPasswordInput = document.getElementById('new-password');
        const confirmPasswordInput = document.getElementById('confirm-password');

        let currentStep = 1;
        let securityQuestions = []; // To store fetched security questions
        let questionIndex = 0;
        let answers = {}; // To store user's answers

        // --- Mock API Data (Replace with your actual API calls) ---
        const mockSecurityQuestions = [
            { id: 1, question: "What was your childhood nickname?" },
            { id: 2, question: "What is the name of your favorite pet?" },
            { id: 3, question: "In what city were you born?" }
        ];

        function showStep(stepNumber) {
            emailVerificationDiv.classList.remove('active');
            securityQuestionsDiv.classList.remove('active');
            passwordResetDiv.classList.remove('active');

            if (stepNumber === 1) {
                emailVerificationDiv.classList.add('active');
            } else if (stepNumber === 2) {
                securityQuestionsDiv.classList.add('active');
                loadQuestion();
            } else if (stepNumber === 3) {
                passwordResetDiv.classList.add('active');
            }
            currentStep = stepNumber;
        }

        async function verifyEmail() {
            const email = emailInput.value;
            // --- Replace with your actual API call to verify email ---
            console.log("Verifying email:", email);
            // Simulate success after a short delay
            setTimeout(() => {
                if (email.includes('@')) {
                    emailVerificationMessage.textContent = "Email verification successful. Proceeding to security questions.";
                    emailVerificationMessage.className = "text-sm mt-2 text-green-500";
                    fetchSecurityQuestions(email);
                } else {
                    emailVerificationMessage.textContent = "Invalid email format.";
                    emailVerificationMessage.className = "text-sm mt-2 text-red-500";
                }
            }, 1000);
        }

        async function fetchSecurityQuestions(email) {
            // --- Replace with your actual API call to fetch security questions based on the verified email ---
            console.log("Fetching security questions for:", email);
            // Simulate fetching questions
            setTimeout(() => {
                securityQuestions = mockSecurityQuestions;
                questionIndex = 0;
                answers = {};
                loadQuestion();
                showStep(2);
            }, 1500);
        }

        function loadQuestion() {
            questionsContainer.innerHTML = '';
            if (securityQuestions.length > 0 && questionIndex < securityQuestions.length) {
                const questionData = securityQuestions[questionIndex];
                const questionDiv = document.createElement('div');
                questionDiv.className = 'mb-4';
                const label = document.createElement('label');
                label.className = 'block text-gray-700 text-sm font-bold mb-2';
                label.setAttribute('for', `answer-${questionData.id}`);
                label.textContent = questionData.question;
                const input = document.createElement('input');
                input.className = 'shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline';
                input.id = `answer-${questionData.id}`;
                input.type = 'text';
                input.placeholder = 'Your answer';
                questionDiv.appendChild(label);
                questionDiv.appendChild(input);
                questionsContainer.appendChild(questionDiv);

                prevQuestionBtn.disabled = questionIndex === 0;
            } else if (securityQuestions.length === 0) {
                questionsContainer.textContent = "No security questions found for this email.";
                submitAnswersBtn.disabled = true;
            }
        }

        function nextQuestion() {
            if (securityQuestions.length > 0 && questionIndex < securityQuestions.length - 1) {
                const currentAnswer = questionsContainer.querySelector('input').value;
                answers[securityQuestions[questionIndex].id] = currentAnswer;
                questionIndex++;
                loadQuestion();
            }
        }

        async function submitAnswers() {
            if (securityQuestions.length > 0 && questionIndex < securityQuestions.length) {
                const currentAnswer = questionsContainer.querySelector('input').value;
                answers[securityQuestions[questionIndex].id] = currentAnswer;
            }
            // --- Replace with your actual API call to submit and verify security question answers ---
            console.log("Submitting answers:", answers);
            // Simulate answer submission
            setTimeout(() => {
                const allQuestionsAnswered = Object.keys(answers).length === securityQuestions.length;
                if (allQuestionsAnswered) {
                    securityQuestionsMessage.textContent = "Security answers verified successfully. Proceed to reset password.";
                    securityQuestionsMessage.className = "text-sm mt-2 text-green-500";
                    showStep(3);
                } else {
                    securityQuestionsMessage.textContent = "Please answer all security questions.";
                    securityQuestionsMessage.className = "text-sm mt-2 text-red-500";
                }
            }, 1200);
        }

        async function resetPassword() {
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (newPassword === confirmPassword && newPassword.length >= 6) {
                // --- Replace with your actual API call to reset the password ---
                console.log("Resetting password with:", newPassword);
                // Simulate password reset
                setTimeout(() => {
                    passwordResetMessage.textContent = "Password reset successful! You can now log in with your new password.";
                    passwordResetMessage.className = "text-sm mt-2 text-green-500";
                    // Optionally redirect to login page after a delay
                    setTimeout(() => {
                        window.location.href = '/login'; // Replace with your login page URL
                    }, 2000);
                }, 1000);
            } else if (newPassword !== confirmPassword) {
                passwordResetMessage.textContent = "New passwords do not match.";
                passwordResetMessage.className = "text-sm mt-2 text-red-500";
            } else {
                passwordResetMessage.textContent = "Password must be at least 6 characters long.";
                passwordResetMessage.className = "text-sm mt-2 text-red-500";
            }
        }

        verifyEmailBtn.addEventListener('click', verifyEmail);
        submitAnswersBtn.addEventListener('click', submitAnswers);
        resetPasswordBtn.addEventListener('click', resetPassword);
        prevQuestionBtn.addEventListener('click', () => {
            if (questionIndex > 0) {
                const currentAnswer = questionsContainer.querySelector('input').value;
                answers[securityQuestions[questionIndex].id] = currentAnswer;
                questionIndex--;
                loadQuestion();
            }
        });
        prevResetBtn.addEventListener('click', () => showStep(2));

        // Initial step
        showStep(1);
    </script>
</body>
</html>
