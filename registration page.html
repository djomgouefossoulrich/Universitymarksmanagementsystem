<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Controlled Registration Page</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto py-10 px-4">
        <!-- Admin Controls Section -->
        <div class="bg-white p-6 rounded-lg shadow-lg mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Admin Controls</h2>
            <div class="border-b pb-4 mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Registration Status</label>
                <div class="flex items-center">
                    <label class="inline-flex items-center mr-6">
                        <input type="radio" name="regStatus" value="open" class="form-radio h-5 w-5 text-blue-600" checked>
                        <span class="ml-2 text-gray-700">Open</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" name="regStatus" value="closed" class="form-radio h-5 w-5 text-blue-600">
                        <span class="ml-2 text-gray-700">Closed</span>
                    </label>
                </div>
            </div>
            
            <div class="border-b pb-4 mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Available Roles</label>
                <div class="flex flex-wrap">
                    <label class="inline-flex items-center mr-6 mb-2">
                        <input type="checkbox" name="roles" value="admin" class="form-checkbox h-5 w-5 text-blue-600" checked>
                        <span class="ml-2 text-gray-700">Admin</span>
                    </label>
                    <label class="inline-flex items-center mr-6 mb-2">
                        <input type="checkbox" name="roles" value="manager" class="form-checkbox h-5 w-5 text-blue-600" checked>
                        <span class="ml-2 text-gray-700">Manager</span>
                    </label>
                    <label class="inline-flex items-center mr-6 mb-2">
                        <input type="checkbox" name="roles" value="user" class="form-checkbox h-5 w-5 text-blue-600" checked>
                        <span class="ml-2 text-gray-700">User</span>
                    </label>
                    <label class="inline-flex items-center mr-6 mb-2">
                        <input type="checkbox" name="roles" value="guest" class="form-checkbox h-5 w-5 text-blue-600" checked>
                        <span class="ml-2 text-gray-700">Guest</span>
                    </label>
                </div>
            </div>
            
            <div class="border-b pb-4 mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Available Departments</label>
                <div class="flex flex-wrap">
                    <label class="inline-flex items-center mr-6 mb-2">
                        <input type="checkbox" name="departments" value="it" class="form-checkbox h-5 w-5 text-blue-600" checked>
                        <span class="ml-2 text-gray-700">IT</span>
                    </label>
                    <label class="inline-flex items-center mr-6 mb-2">
                        <input type="checkbox" name="departments" value="hr" class="form-checkbox h-5 w-5 text-blue-600" checked>
                        <span class="ml-2 text-gray-700">HR</span>
                    </label>
                    <label class="inline-flex items-center mr-6 mb-2">
                        <input type="checkbox" name="departments" value="finance" class="form-checkbox h-5 w-5 text-blue-600" checked>
                        <span class="ml-2 text-gray-700">Finance</span>
                    </label>
                    <label class="inline-flex items-center mr-6 mb-2">
                        <input type="checkbox" name="departments" value="sales" class="form-checkbox h-5 w-5 text-blue-600" checked>
                        <span class="ml-2 text-gray-700">Sales</span>
                    </label>
                    <label class="inline-flex items-center mr-6 mb-2">
                        <input type="checkbox" name="departments" value="marketing" class="form-checkbox h-5 w-5 text-blue-600" checked>
                        <span class="ml-2 text-gray-700">Marketing</span>
                    </label>
                </div>
            </div>
            
            <div>
                <button id="saveAdminSettings" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                    Save Settings
                </button>
            </div>
        </div>
        
        <!-- Registration Form Section -->
        <div id="registrationForm" class="bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">User Registration</h2>
            
            <!-- User Information Form -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-gray-700 mb-4">User Information</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="firstName">
                            First Name <span class="text-red-500">*</span>
                        </label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="firstName" type="text" placeholder="First Name">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="lastName">
                            Last Name <span class="text-red-500">*</span>
                        </label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="lastName" type="text" placeholder="Last Name">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="email">
                            Email Address <span class="text-red-500">*</span>
                        </label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="email" type="email" placeholder="Email Address">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="phone">
                            Phone Number
                        </label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="phone" type="tel" placeholder="Phone Number">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                            Password <span class="text-red-500">*</span>
                        </label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="password" type="password" placeholder="Password">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="confirmPassword">
                            Confirm Password <span class="text-red-500">*</span>
                        </label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="confirmPassword" type="password" placeholder="Confirm Password">
                    </div>
                </div>
            </div>
            
            <!-- Role Assignment -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-gray-700 mb-4">Role Assignment</h3>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="role">
                    Select Role <span class="text-red-500">*</span>
                </label>
                <select class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="role">
                    <option value="">-- Select Role --</option>
                    <option value="admin">Admin</option>
                    <option value="manager">Manager</option>
                    <option value="user">User</option>
                    <option value="guest">Guest</option>
                </select>
            </div>
            
            <!-- Department Selection -->
            <div class="mb-8">
                <h3 class="text-lg font-semibold text-gray-700 mb-4">Department Selection</h3>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="department">
                    Select Department <span class="text-red-500">*</span>
                </label>
                <select class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="department">
                    <option value="">-- Select Department --</option>
                    <option value="it">IT</option>
                    <option value="hr">HR</option>
                    <option value="finance">Finance</option>
                    <option value="sales">Sales</option>
                    <option value="marketing">Marketing</option>
                </select>
            </div>
            
            <div class="flex items-center justify-between">
                <button id="registerButton" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-6 rounded focus:outline-none focus:shadow-outline">
                    Register
                </button>
                <button id="resetButton" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-6 rounded focus:outline-none focus:shadow-outline">
                    Reset
                </button>
            </div>
        </div>
        
        <!-- Registration Status Message -->
        <div id="statusMessage" class="hidden mt-4 p-4 rounded-lg"></div>
    </div>

    <script>
        // Admin settings management
        document.getElementById('saveAdminSettings').addEventListener('click', function() {
            // Get registration status
            const regStatus = document.querySelector('input[name="regStatus"]:checked').value;
            
            // Get selected roles
            const roleCheckboxes = document.querySelectorAll('input[name="roles"]:checked');
            const selectedRoles = Array.from(roleCheckboxes).map(cb => cb.value);
            
            // Get selected departments
            const deptCheckboxes = document.querySelectorAll('input[name="departments"]:checked');
            const selectedDepts = Array.from(deptCheckboxes).map(cb => cb.value);
            
            // Update registration form availability based on admin settings
            const registrationForm = document.getElementById('registrationForm');
            const statusMessage = document.getElementById('statusMessage');
            
            if (regStatus === 'closed') {
                registrationForm.classList.add('hidden');
                statusMessage.classList.remove('hidden', 'bg-green-100', 'text-green-800');
                statusMessage.classList.add('bg-red-100', 'text-red-800');
                statusMessage.textContent = 'Registration is currently closed by admin.';
            } else {
                registrationForm.classList.remove('hidden');
                statusMessage.classList.add('hidden');
            }
            
            // Update role dropdown based on available roles
            const roleSelect = document.getElementById('role');
            // Clear current options except first one
            const firstRoleOption = roleSelect.options[0];
            roleSelect.innerHTML = '';
            roleSelect.appendChild(firstRoleOption);
            
            // Add new options based on selected roles
            selectedRoles.forEach(role => {
                const option = document.createElement('option');
                option.value = role;
                option.textContent = role.charAt(0).toUpperCase() + role.slice(1);
                roleSelect.appendChild(option);
            });
            
            // Update department dropdown based on available departments
            const deptSelect = document.getElementById('department');
            // Clear current options except first one
            const firstDeptOption = deptSelect.options[0];
            deptSelect.innerHTML = '';
            deptSelect.appendChild(firstDeptOption);
            
            // Add new options based on selected departments
            selectedDepts.forEach(dept => {
                const option = document.createElement('option');
                option.value = dept;
                option.textContent = dept.charAt(0).toUpperCase() + dept.slice(1);
                deptSelect.appendChild(option);
            });
            
            alert('Admin settings saved successfully!');
        });
        
        // Form submission
        document.getElementById('registerButton').addEventListener('click', function(e) {
            e.preventDefault();
            
            // Get form values
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.getElementById('role').value;
            const department = document.getElementById('department').value;
            
            // Simple validation
            const errors = [];
            
            if (!firstName) errors.push('First name is required');
            if (!lastName) errors.push('Last name is required');
            if (!email) errors.push('Email is required');
            if (!validateEmail(email)) errors.push('Invalid email format');
            if (!password) errors.push('Password is required');
            if (password !== confirmPassword) errors.push('Passwords do not match');
            if (!role) errors.push('Role selection is required');
            if (!department) errors.push('Department selection is required');
            
            const statusMessage = document.getElementById('statusMessage');
            
            if (errors.length > 0) {
                // Display errors
                statusMessage.classList.remove('hidden', 'bg-green-100', 'text-green-800');
                statusMessage.classList.add('bg-red-100', 'text-red-800');
                statusMessage.innerHTML = '<ul class="list-disc pl-5">' + 
                    errors.map(error => `<li>${error}</li>`).join('') + 
                    '</ul>';
            } else {
                // Form is valid, submit or process
                const userData = {
                    firstName,
                    lastName,
                    email,
                    phone,
                    password,
                    role,
                    department
                };
                
                console.log('User data:', userData);
                // Here you would typically send this data to your backend
                
                // Show success message
                statusMessage.classList.remove('hidden', 'bg-red-100', 'text-red-800');
                statusMessage.classList.add('bg-green-100', 'text-green-800');
                statusMessage.textContent = 'Registration successful! User has been created.';
                
                // Reset form
                document.getElementById('resetButton').click();
            }
        });
        
        // Form reset
        document.getElementById('resetButton').addEventListener('click', function() {
            document.getElementById('firstName').value = '';
            document.getElementById('lastName').value = '';
            document.getElementById('email').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('password').value = '';
            document.getElementById('confirmPassword').value = '';
            document.getElementById('role').selectedIndex = 0;
            document.getElementById('department').selectedIndex = 0;
        });
        
        // Email validation helper
        function validateEmail(email) {
            const re = /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
            return re.test(String(email).toLowerCase());
        }
    </script>
</body>
</html>
