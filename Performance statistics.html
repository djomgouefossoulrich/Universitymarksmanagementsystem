<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Management System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-800">Lecturer's Marks Management System</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left Panel: Student Management -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold mb-4 text-blue-700">Student Management</h2>
                
                <form id="studentForm" class="space-y-4">
                    <div>
                        <label for="studentId" class="block text-sm font-medium text-gray-700">Student ID</label>
                        <input type="text" id="studentId" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required>
                    </div>
                    
                    <div>
                        <label for="studentName" class="block text-sm font-medium text-gray-700">Student Name</label>
                        <input type="text" id="studentName" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required>
                    </div>
                    
                    <div>
                        <label for="course" class="block text-sm font-medium text-gray-700">Course</label>
                        <input type="text" id="course" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="assignment" class="block text-sm font-medium text-gray-700">Assignment (30%)</label>
                            <input type="number" id="assignment" min="0" max="30" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required>
                        </div>
                        
                        <div>
                            <label for="midterm" class="block text-sm font-medium text-gray-700">Midterm (20%)</label>
                            <input type="number" id="midterm" min="0" max="20" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="final" class="block text-sm font-medium text-gray-700">Final Exam (50%)</label>
                            <input type="number" id="final" min="0" max="50" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required>
                        </div>
                        
                        <div>
                            <label for="total" class="block text-sm font-medium text-gray-700">Total Score</label>
                            <input type="number" id="total" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border bg-gray-100" readonly>
                        </div>
                    </div>
                    
                    <div>
                        <label for="grade" class="block text-sm font-medium text-gray-700">Grade</label>
                        <input type="text" id="grade" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border bg-gray-100" readonly>
                    </div>
                    
                    <div class="flex justify-between">
                        <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            Add Student
                        </button>
                        <button type="button" id="updateBtn" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500" disabled>
                            Update
                        </button>
                        <button type="button" id="clearBtn" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-gray-600 hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500">
                            Clear
                        </button>
                    </div>
                </form>
            </div>
            
            <!-- Middle Panel: Student List -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold mb-4 text-blue-700">Student List</h2>
                
                <div class="mb-4">
                    <input type="text" id="searchInput" placeholder="Search by name or ID..." class="block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                </div>
                
                <div class="overflow-y-auto max-h-96">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Grade</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentList" class="bg-white divide-y divide-gray-200">
                            <!-- Student data will be added here -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- Right Panel: Performance Statistics -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold mb-4 text-blue-700">Performance Statistics</h2>
                
                <div class="space-y-6">
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <h3 class="text-lg font-medium text-gray-800 mb-2">Class Summary</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <p class="text-sm text-gray-600">Total Students</p>
                                <p id="totalStudents" class="text-2xl font-bold text-blue-700">0</p>
                            </div>
                            <div>
                                <p class="text-sm text-gray-600">Class Average</p>
                                <p id="classAverage" class="text-2xl font-bold text-blue-700">0%</p>
                            </div>
                            <div>
                                <p class="text-sm text-gray-600">Highest Score</p>
                                <p id="highestScore" class="text-2xl font-bold text-green-600">0%</p>
                            </div>
                            <div>
                                <p class="text-sm text-gray-600">Lowest Score</p>
                                <p id="lowestScore" class="text-2xl font-bold text-red-600">0%</p>
                            </div>
                        </div>
                    </div>
                    
                    <div>
                        <h3 class="text-lg font-medium text-gray-800 mb-2">Grade Distribution</h3>
                        <canvas id="gradeChart" class="w-full h-48"></canvas>
                    </div>
                    
                    <div>
                        <h3 class="text-lg font-medium text-gray-800 mb-2">Assessment Performance</h3>
                        <canvas id="assessmentChart" class="w-full h-48"></canvas>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Student Details Modal -->
        <div id="studentModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center hidden">
            <div class="bg-white rounded-lg shadow-xl p-6 max-w-md w-full">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-blue-700">Student Details</h2>
                    <button id="closeModal" class="text-gray-500 hover:text-gray-700">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                
                <div id="studentDetails" class="space-y-4">
                    <!-- Student details will be displayed here -->
                </div>
                
                <div class="mt-6 flex justify-end">
                    <button id="closeDetailBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize charts
            const gradeChart = new Chart(document.getElementById('gradeChart'), {
                type: 'bar',
                data: {
                    labels: ['A', 'B', 'C', 'D', 'F'],
                    datasets: [{
                        label: 'Number of Students',
                        data: [0, 0, 0, 0, 0],
                        backgroundColor: [
                            'rgba(52, 211, 153, 0.8)',
                            'rgba(59, 130, 246, 0.8)',
                            'rgba(251, 191, 36, 0.8)',
                            'rgba(249, 115, 22, 0.8)',
                            'rgba(239, 68, 68, 0.8)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });

            const assessmentChart = new Chart(document.getElementById('assessmentChart'), {
                type: 'radar',
                data: {
                    labels: ['Assignment', 'Midterm', 'Final Exam'],
                    datasets: [{
                        label: 'Class Average (%)',
                        data: [0, 0, 0],
                        backgroundColor: 'rgba(59, 130, 246, 0.2)',
                        borderColor: 'rgba(59, 130, 246, 1)',
                        borderWidth: 2,
                        pointBackgroundColor: 'rgba(59, 130, 246, 1)'
                    }]
                },
                options: {
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                stepSize: 20
                            }
                        }
                    }
                }
            });

            // Student data storage
            let students = [];
            let currentStudentIndex = -1;

            // Form elements
            const studentForm = document.getElementById('studentForm');
            const studentIdInput = document.getElementById('studentId');
            const studentNameInput = document.getElementById('studentName');
            const courseInput = document.getElementById('course');
            const assignmentInput = document.getElementById('assignment');
            const midtermInput = document.getElementById('midterm');
            const finalInput = document.getElementById('final');
            const totalInput = document.getElementById('total');
            const gradeInput = document.getElementById('grade');
            const updateBtn = document.getElementById('updateBtn');
            const clearBtn = document.getElementById('clearBtn');
            const searchInput = document.getElementById('searchInput');

            // Modal elements
            const studentModal = document.getElementById('studentModal');
            const closeModal = document.getElementById('closeModal');
            const closeDetailBtn = document.getElementById('closeDetailBtn');
            const studentDetails = document.getElementById('studentDetails');

            // Calculate total score and grade
            function calculateTotal() {
                const assignment = parseFloat(assignmentInput.value) || 0;
                const midterm = parseFloat(midtermInput.value) || 0;
                const final = parseFloat(finalInput.value) || 0;
                
                const total = assignment + midterm + final;
                totalInput.value = total.toFixed(2);
                
                // Calculate grade
                let grade = 'F';
                if (total >= 90) {
                    grade = 'A';
                } else if (total >= 80) {
                    grade = 'B';
                } else if (total >= 70) {
                    grade = 'C';
                } else if (total >= 60) {
                    grade = 'D';
                }
                
                gradeInput.value = grade;
            }

            // Add event listeners to calculate total on input change
            assignmentInput.addEventListener('input', calculateTotal);
            midtermInput.addEventListener('input', calculateTotal);
            finalInput.addEventListener('input', calculateTotal);

            // Add or update student
            studentForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Get form values
                const studentId = studentIdInput.value;
                const studentName = studentNameInput.value;
                const course = courseInput.value;
                const assignment = parseFloat(assignmentInput.value);
                const midterm = parseFloat(midtermInput.value);
                const final = parseFloat(finalInput.value);
                const total = parseFloat(totalInput.value);
                const grade = gradeInput.value;
                
                // Create student object
                const student = {
                    id: studentId,
                    name: studentName,
                    course: course,
                    assignment: assignment,
                    midterm: midterm,
                    final: final,
                    total: total,
                    grade: grade
                };
                
                // Check if we're updating an existing student
                if (currentStudentIndex >= 0) {
                    students[currentStudentIndex] = student;
                } else {
                    // Check if student ID already exists
                    const existingIndex = students.findIndex(s => s.id === studentId);
                    if (existingIndex >= 0) {
                        alert('A student with this ID already exists!');
                        return;
                    }
                    
                    // Add new student
                    students.push(student);
                }
                
                // Update display
                updateStudentList();
                updateStatistics();
                
                // Reset form
                studentForm.reset();
                totalInput.value = '';
                gradeInput.value = '';
                currentStudentIndex = -1;
                updateBtn.disabled = true;
            });

            // Clear form
            clearBtn.addEventListener('click', function() {
                studentForm.reset();
                totalInput.value = '';
                gradeInput.value = '';
                currentStudentIndex = -1;
                updateBtn.disabled = true;
            });

            // Search functionality
            searchInput.addEventListener('input', function() {
                updateStudentList();
            });

            // Close modal
            closeModal.addEventListener('click', function() {
                studentModal.classList.add('hidden');
            });

            closeDetailBtn.addEventListener('click', function() {
                studentModal.classList.add('hidden');
            });

            // Update student list display
            function updateStudentList() {
                const studentList = document.getElementById('studentList');
                const searchTerm = searchInput.value.toLowerCase();
                
                // Clear the list
                studentList.innerHTML = '';
                
                // Filter students based on search term
                const filteredStudents = students.filter(student => 
                    student.id.toLowerCase().includes(searchTerm) || 
                    student.name.toLowerCase().includes(searchTerm)
                );
                
                // Add each student to the list
                filteredStudents.forEach((student, index) => {
                    const row = document.createElement('tr');
                    
                    // Add hover effect
                    row.className = 'hover:bg-gray-100';
                    
                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${student.id}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${student.name}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${student.total}%</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${getGradeColor(student.grade)}">
                                ${student.grade}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <button class="text-blue-600 hover:text-blue-900 mr-3 view-btn" data-index="${students.indexOf(student)}">View</button>
                            <button class="text-indigo-600 hover:text-indigo-900 mr-3 edit-btn" data-index="${students.indexOf(student)}">Edit</button>
                            <button class="text-red-600 hover:text-red-900 delete-btn" data-index="${students.indexOf(student)}">Delete</button>
                        </td>
                    `;
                    
                    studentList.appendChild(row);
                });
                
                // Add event listeners to view, edit, and delete buttons
                document.querySelectorAll('.view-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = parseInt(this.getAttribute('data-index'));
                        viewStudent(index);
                    });
                });
                
                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = parseInt(this.getAttribute('data-index'));
                        editStudent(index);
                    });
                });
                
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = parseInt(this.getAttribute('data-index'));
                        deleteStudent(index);
                    });
                });
            }

            // View student details
            function viewStudent(index) {
                const student = students[index];
                
                // Update modal content
                studentDetails.innerHTML = `
                    <div class="grid grid-cols-2 gap-2">
                        <div class="text-gray-700">Student ID:</div>
                        <div class="font-medium">${student.id}</div>
                        
                        <div class="text-gray-700">Student Name:</div>
                        <div class="font-medium">${student.name}</div>
                        
                        <div class="text-gray-700">Course:</div>
                        <div class="font-medium">${student.course}</div>
                        
                        <div class="text-gray-700">Assignment:</div>
                        <div class="font-medium">${student.assignment} / 30</div>
                        
                        <div class="text-gray-700">Midterm:</div>
                        <div class="font-medium">${student.midterm} / 20</div>
                        
                        <div class="text-gray-700">Final Exam:</div>
                        <div class="font-medium">${student.final} / 50</div>
                        
                        <div class="text-gray-700">Total Score:</div>
                        <div class="font-medium">${student.total}%</div>
                        
                        <div class="text-gray-700">Grade:</div>
                        <div class="font-medium">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${getGradeColor(student.grade)}">
                                ${student.grade}
                            </span>
                        </div>
                    </div>
                    
                    <div class="mt-4">
                        <h3 class="text-md font-medium text-gray-800 mb-2">Performance Chart</h3>
                        <canvas id="studentPerformanceChart" class="w-full h-32"></canvas>
                    </div>
                `;
                
                // Show modal
                studentModal.classList.remove('hidden');
                
                // Create performance chart
                setTimeout(() => {
                    const ctx = document.getElementById('studentPerformanceChart').getContext('2d');
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: ['Assignment', 'Midterm', 'Final'],
                            datasets: [{
                                label: 'Score (%)',
                                data: [
                                    (student.assignment / 30) * 100,
                                    (student.midterm / 20) * 100,
                                    (student.final / 50) * 100
                                ],
                                backgroundColor: [
                                    'rgba(59, 130, 246, 0.8)',
                                    'rgba(16, 185, 129, 0.8)',
                                    'rgba(245, 158, 11, 0.8)'
                                ]
                            }]
                        },
                        options: {
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    max: 100,
                                    ticks: {
                                        callback: function(value) {
                                            return value + '%';
                                        }
                                    }
                                }
                            }
                        }
                    });
                }, 100);
            }

            // Edit student
            function editStudent(index) {
                const student = students[index];
                
                // Fill form with student data
                studentIdInput.value = student.id;
                studentNameInput.value = student.name;
                courseInput.value = student.course;
                assignmentInput.value = student.assignment;
                midtermInput.value = student.midterm;
                finalInput.value = student.final;
                totalInput.value = student.total;
                gradeInput.value = student.grade;
                
                // Set current student index and enable update button
                currentStudentIndex = index;
                updateBtn.disabled = false;
            }

            // Delete student
            function deleteStudent(index) {
                if (confirm('Are you sure you want to delete this student?')) {
                    students.splice(index, 1);
                    updateStudentList();
                    updateStatistics();
                    
                    // If we were editing this student, reset the form
                    if (currentStudentIndex === index) {
                        studentForm.reset();
                        totalInput.value = '';
                        gradeInput.value = '';
                        currentStudentIndex = -1;
                        updateBtn.disabled = true;
                    }
                }
            }

            // Update statistics
            function updateStatistics() {
                // Class summary
                document.getElementById('totalStudents').textContent = students.length;
                
                // Class average
                let totalScore = 0;
                students.forEach(student => {
                    totalScore += student.total;
                });
                
                const average = students.length > 0 ? totalScore / students.length : 0;
                document.getElementById('classAverage').textContent = average.toFixed(2) + '%';
                
                // Highest and lowest scores
                let highestScore = 0;
                let lowestScore = 100;
                
                students.forEach(student => {
                    if (student.total > highestScore) {
                        highestScore = student.total;
                    }
                    if (student.total < lowestScore) {
                        lowestScore = student.total;
                    }
                });
                
                if (students.length === 0) {
                    lowestScore = 0;
                }
                
                document.getElementById('highestScore').textContent = highestScore.toFixed(2) + '%';
                document.getElementById('lowestScore').textContent = lowestScore.toFixed(2) + '%';
                
                // Grade distribution
                const gradeCounts = { 'A': 0, 'B': 0, 'C': 0, 'D': 0, 'F': 0 };
                students.forEach(student => {
                    gradeCounts[student.grade]++;
                });
                
                gradeChart.data.datasets[0].data = [
                    gradeCounts['A'],
                    gradeCounts['B'],
                    gradeCounts['C'],
                    gradeCounts['D'],
                    gradeCounts['F']
                ];
                gradeChart.update();
                
                // Assessment performance
                let totalAssignment = 0;
                let totalMidterm = 0;
                let totalFinal = 0;
                
                students.forEach(student => {
                    totalAssignment += (student.assignment / 30) * 100;
                    totalMidterm += (student.midterm / 20) * 100;
                    totalFinal += (student.final / 50) * 100;
                });
                
                const avgAssignment = students.length > 0 ? totalAssignment / students.length : 0;
                const avgMidterm = students.length > 0 ? totalMidterm / students.length : 0;
                const avgFinal = students.length > 0 ? totalFinal / students.length : 0;
                
                assessmentChart.data.datasets[0].data = [
                    avgAssignment,
                    avgMidterm,
                    avgFinal
                ];
                assessmentChart.update();
            }

            // Helper function to get grade color
            function getGradeColor(grade) {
                switch (grade) {
                    case 'A': return 'bg-green-100 text-green-800';
                    case 'B': return 'bg-blue-100 text-blue-800';
                    case 'C': return 'bg-yellow-100 text-yellow-800';
                    case 'D': return 'bg-orange-100 text-orange-800';
                    case 'F': return 'bg-red-100 text-red-800';
                    default: return 'bg-gray-100 text-gray-800';
                }
            }

            // Initial setup
            updateBtn.addEventListener('click', function() {
                if (currentStudentIndex >= 0) {
                    studentForm.dispatchEvent(new Event('submit'));
                }
            });

            // Load sample data for demonstration
            function loadSampleData() {
                students = [
                    {
                        id: 'STU001',
                        name: 'John Doe',
                        course: 'Computer Science',
                        assignment: 25,
                        midterm: 16,
                        final: 42,
                        total: 83,
                        grade: 'B'
                    },
                    {
                        id: 'STU002',
                        name: 'Jane Smith',
                        course: 'Mathematics',
                        assignment: 28,
                        midterm: 19,
                        final: 47,
                        total: 94,
                        grade: 'A'
                    },
                    {
                        id: 'STU003',
                        name: 'Robert Johnson',
                        course: 'Physics',
                        assignment: 20,
                        midterm: 12,
                        final: 35,
                        total: 67,
                        grade: 'C'
                    },
                    {
                        id: 'STU004',
                        name: 'Emily Brown',
                        course: 'Chemistry',
                        assignment: 15,
                        midterm: 10,
                        final: 30,
                        total: 55,
                        grade: 'F'
                    }
                ];
                
                updateStudentList();
                updateStatistics();
            }
            
            // Load sample data
            loadSampleData();
        });
    </script>
</body>
</html>
