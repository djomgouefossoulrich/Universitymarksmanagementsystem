<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade Calculator - Exam Controller</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .calculator-card {
      transition: transform 0.2s;
    }
    .calculator-card:hover {
      transform: translateY(-2px);
    }
    .input-group {
      transition: all 0.3s ease;
    }
    .input-group:hover {
      background-color: #f8fafc;
    }
    .result-card {
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
    }
    .result-card.show {
      opacity: 1;
      transform: translateY(0);
    }
    .grade-scale-row {
      transition: background-color 0.2s;
    }
    .grade-scale-row:hover {
      background-color: #f1f5f9;
    }
    .toast {
      transition: transform 0.3s ease, opacity 0.3s ease;
      transform: translateY(100%);
      opacity: 0;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Grade Calculator</h1>
      <p class="text-gray-600">Calculate and analyze student grades with various methods</p>
    </div>

    <!-- Calculator Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Standard Grade Calculator -->
      <div class="calculator-card bg-white rounded-lg shadow-md p-6">
        <div class="flex items-center mb-4">
          <i class="fas fa-calculator text-indigo-600 text-xl mr-3"></i>
          <h2 class="text-xl font-semibold text-gray-800">Standard Calculator</h2>
        </div>
        <form id="standardCalculator" class="space-y-4">
          <div class="input-group p-2 rounded">
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Total Marks Obtained
            </label>
            <input type="number" name="obtained" class="w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200" required>
          </div>
          <div class="input-group p-2 rounded">
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Total Possible Marks
            </label>
            <input type="number" name="total" class="w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200" required>
          </div>
          <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition duration-200">
            Calculate Grade
          </button>
        </form>
      </div>

      <!-- Weighted Grade Calculator -->
      <div class="calculator-card bg-white rounded-lg shadow-md p-6">
        <div class="flex items-center mb-4">
          <i class="fas fa-balance-scale text-indigo-600 text-xl mr-3"></i>
          <h2 class="text-xl font-semibold text-gray-800">Weighted Calculator</h2>
        </div>
        <form id="weightedCalculator" class="space-y-4">
          <div id="weightedItems" class="space-y-3">
            <div class="input-group p-2 rounded">
              <div class="flex justify-between items-center mb-1">
                <label class="block text-sm font-medium text-gray-700">Component 1</label>
                <input type="number" name="weight[]" placeholder="Weight %" class="w-20 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200" required>
              </div>
              <input type="number" name="score[]" placeholder="Score" class="w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200" required>
            </div>
          </div>
          <div class="flex space-x-2">
            <button type="button" id="addWeighted" class="flex-1 bg-gray-200 text-gray-700 py-2 px-4 rounded-md hover:bg-gray-300 transition duration-200">
              Add Component
            </button>
            <button type="submit" class="flex-1 bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition duration-200">
              Calculate
            </button>
          </div>
        </form>
      </div>

      <!-- Grade Scale Editor -->
      <div class="calculator-card bg-white rounded-lg shadow-md p-6">
        <div class="flex items-center mb-4">
          <i class="fas fa-sliders-h text-indigo-600 text-xl mr-3"></i>
          <h2 class="text-xl font-semibold text-gray-800">Grade Scale</h2>
        </div>
        <div class="space-y-3">
          <div class="grade-scale-row p-2 rounded flex justify-between items-center">
            <span class="text-sm font-medium text-gray-700">A+</span>
            <input type="number" class="w-20 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200" value="97">
          </div>
          <div class="grade-scale-row p-2 rounded flex justify-between items-center">
            <span class="text-sm font-medium text-gray-700">A</span>
            <input type="number" class="w-20 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200" value="93">
          </div>
          <div class="grade-scale-row p-2 rounded flex justify-between items-center">
            <span class="text-sm font-medium text-gray-700">A-</span>
            <input type="number" class="w-20 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200" value="90">
          </div>
          <div class="grade-scale-row p-2 rounded flex justify-between items-center">
            <span class="text-sm font-medium text-gray-700">B+</span>
            <input type="number" class="w-20 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200" value="87">
          </div>
          <div class="grade-scale-row p-2 rounded flex justify-between items-center">
            <span class="text-sm font-medium text-gray-700">B</span>
            <input type="number" class="w-20 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200" value="83">
          </div>
          <button id="saveScale" class="w-full mt-2 bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 transition duration-200">
            Save Scale
          </button>
        </div>
      </div>
    </div>

    <!-- Results Section -->
    <div id="results" class="mt-8 space-y-4">
      <!-- Results will be dynamically added here -->
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast fixed bottom-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg">
    <span id="toastMessage"></span>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Cache DOM elements
      const standardForm = document.getElementById('standardCalculator');
      const weightedForm = document.getElementById('weightedCalculator');
      const addWeightedBtn = document.getElementById('addWeighted');
      const weightedItems = document.getElementById('weightedItems');
      const saveScaleBtn = document.getElementById('saveScale');
      const resultsContainer = document.getElementById('results');
      const toast = document.getElementById('toast');

      // Grade scale configuration
      let gradeScale = {
        'A+': 97,
        'A': 93,
        'A-': 90,
        'B+': 87,
        'B': 83,
        'B-': 80,
        'C+': 77,
        'C': 73,
        'C-': 70,
        'D+': 67,
        'D': 63,
        'D-': 60,
        'F': 0
      };

      // Standard Calculator
      standardForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const obtained = parseFloat(e.target.obtained.value);
        const total = parseFloat(e.target.total.value);
        
        if (obtained > total) {
          showToast('Obtained marks cannot exceed total marks', 'error');
          return;
        }

        const percentage = (obtained / total) * 100;
        const grade = calculateGrade(percentage);
        
        displayResult({
          type: 'standard',
          percentage,
          grade,
          details: {
            obtained,
            total
          }
        });
      });

      // Weighted Calculator
      weightedForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const weights = [...e.target.elements['weight[]']].map(input => parseFloat(input.value));
        const scores = [...e.target.elements['score[]']].map(input => parseFloat(input.value));
        
        const totalWeight = weights.reduce((sum, weight) => sum + weight, 0);
        if (Math.abs(totalWeight - 100) > 0.01) {
          showToast('Total weight must equal 100%', 'error');
          return;
        }

        const weightedSum = weights.reduce((sum, weight, i) => {
          return sum + (weight * scores[i] / 100);
        }, 0);

        const grade = calculateGrade(weightedSum);
        
        displayResult({
          type: 'weighted',
          percentage: weightedSum,
          grade,
          details: {
            components: weights.map((weight, i) => ({
              weight,
              score: scores[i]
            }))
          }
        });
      });

      // Add Weighted Component
      addWeightedBtn.addEventListener('click', () => {
        const componentCount = weightedItems.children.length + 1;
        const newComponent = document.createElement('div');
        newComponent.className = 'input-group p-2 rounded';
        newComponent.innerHTML = `
          <div class="flex justify-between items-center mb-1">
            <label class="block text-sm font-medium text-gray-700">Component ${componentCount}</label>
            <input type="number" name="weight[]" placeholder="Weight %" class="w-20 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200" required>
          </div>
          <input type="number" name="score[]" placeholder="Score" class="w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200" required>
        `;
        weightedItems.appendChild(newComponent);
      });

      // Save Grade Scale
      saveScaleBtn.addEventListener('click', () => {
        const inputs = document.querySelectorAll('.grade-scale-row input');
        let isValid = true;
        let prevValue = 100;

        inputs.forEach(input => {
          const value = parseFloat(input.value);
          if (value > prevValue) {
            isValid = false;
          }
          prevValue = value;
        });

        if (!isValid) {
          showToast('Invalid grade scale: Values must be in descending order', 'error');
          return;
        }

        showToast('Grade scale saved successfully');
      });

      // Calculate Grade
      function calculateGrade(percentage) {
        for (const [grade, threshold] of Object.entries(gradeScale)) {
          if (percentage >= threshold) {
            return grade;
          }
        }
        return 'F';
      }

      // Display Result
      function displayResult(result) {
        const resultCard = document.createElement('div');
        resultCard.className = 'result-card bg-white rounded-lg shadow-md p-6';
        
        let detailsHtml = '';
        if (result.type === 'standard') {
          detailsHtml = `
            <div class="text-sm text-gray-600">
              <p>Marks Obtained: ${result.details.obtained}</p>
              <p>Total Marks: ${result.details.total}</p>
            </div>
          `;
        } else {
          detailsHtml = `
            <div class="text-sm text-gray-600">
              <p>Components:</p>
              ${result.details.components.map((comp, i) => 
                `<p>Component ${i + 1}: ${comp.score}% (Weight: ${comp.weight}%)</p>`
              ).join('')}
            </div>
          `;
        }

        resultCard.innerHTML = `
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-semibold text-gray-800">
              ${result.type === 'standard' ? 'Standard' : 'Weighted'} Calculation Result
            </h3>
            <button class="text-gray-400 hover:text-gray-600" onclick="this.closest('.result-card').remove()">
              <i class="fas fa-times"></i>
            </button>
          </div>
          <div class="flex items-center space-x-4 mb-4">
            <div class="text-4xl font-bold ${getGradeColor(result.grade)}">
              ${result.grade}
            </div>
            <div class="text-2xl text-gray-600">
              ${result.percentage.toFixed(2)}%
            </div>
          </div>
          ${detailsHtml}
        `;

        resultsContainer.insertBefore(resultCard, resultsContainer.firstChild);
        setTimeout(() => resultCard.classList.add('show'), 10);
      }

      // Get Grade Color
      function getGradeColor(grade) {
        if (grade.startsWith('A')) return 'text-green-600';
        if (grade.startsWith('B')) return 'text-blue-600';
        if (grade.startsWith('C')) return 'text-yellow-600';
        if (grade.startsWith('D')) return 'text-orange-600';
        return 'text-red-600';
      }

      // Show Toast
      function showToast(message, type = 'success') {
        toast.className = `toast fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg ${
          type === 'error' ? 'bg-red-500' : 'bg-green-500'
        } text-white`;
        toast.textContent = message;
        toast.classList.add('show');
        
        setTimeout(() => {
          toast.classList.remove('show');
        }, 3000);
      }
    });
  </script>
</body>
</html>
