<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Course Enrollment</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.10.5/cdn.min.js" defer></script>
</head>
<body class="bg-gray-100">
  <div x-data="courseEnrollment" class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-center mb-8 text-blue-800">Student Course Enrollment</h1>
    
    <div class="bg-white rounded-lg shadow-md p-6 mb-8">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold text-gray-800">Available Courses</h2>
        <div class="flex space-x-2">
          <input 
            x-model="searchTerm" 
            type="text" 
            placeholder="Search courses..." 
            class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
          <select 
            x-model="filterCategory" 
            class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">All Categories</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Mathematics">Mathematics</option>
            <option value="Biology">Biology</option>
            <option value="Literature">Literature</option>
            <option value="History">History</option>
          </select>
        </div>
      </div>
      
      <div class="overflow-x-auto">
        <table class="min-w-full bg-white">
          <thead>
            <tr class="bg-blue-100 text-blue-900">
              <th class="py-3 px-4 text-left">Course Code</th>
              <th class="py-3 px-4 text-left">Course Name</th>
              <th class="py-3 px-4 text-left">Instructor</th>
              <th class="py-3 px-4 text-left">Credits</th>
              <th class="py-3 px-4 text-left">Schedule</th>
              <th class="py-3 px-4 text-left">Category</th>
              <th class="py-3 px-4 text-left">Available Slots</th>
              <th class="py-3 px-4 text-left">Action</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="course in filteredCourses" :key="course.id">
              <tr class="border-b hover:bg-gray-50">
                <td class="py-3 px-4" x-text="course.code"></td>
                <td class="py-3 px-4" x-text="course.name"></td>
                <td class="py-3 px-4" x-text="course.instructor"></td>
                <td class="py-3 px-4" x-text="course.credits"></td>
                <td class="py-3 px-4" x-text="course.schedule"></td>
                <td class="py-3 px-4" x-text="course.category"></td>
                <td class="py-3 px-4" x-text="course.availableSlots"></td>
                <td class="py-3 px-4">
                  <button 
                    x-show="!isEnrolled(course.id)"
                    @click="enrollCourse(course)"
                    class="bg-blue-500 hover:bg-blue-600 text-white py-1 px-3 rounded-md text-sm"
                    :disabled="course.availableSlots <= 0"
                    :class="{'opacity-50 cursor-not-allowed': course.availableSlots <= 0}"
                  >
                    Enroll
                  </button>
                  <button 
                    x-show="isEnrolled(course.id)"
                    @click="dropCourse(course)"
                    class="bg-red-500 hover:bg-red-600 text-white py-1 px-3 rounded-md text-sm"
                  >
                    Drop
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
    
    <div class="bg-white rounded-lg shadow-md p-6">
      <h2 class="text-xl font-semibold text-gray-800 mb-4">My Enrolled Courses</h2>
      
      <div x-show="enrolledCourses.length === 0" class="text-gray-500 text-center py-4">
        You haven't enrolled in any courses yet.
      </div>
      
      <div x-show="enrolledCourses.length > 0" class="overflow-x-auto">
        <table class="min-w-full bg-white">
          <thead>
            <tr class="bg-green-100 text-green-900">
              <th class="py-3 px-4 text-left">Course Code</th>
              <th class="py-3 px-4 text-left">Course Name</th>
              <th class="py-3 px-4 text-left">Instructor</th>
              <th class="py-3 px-4 text-left">Credits</th>
              <th class="py-3 px-4 text-left">Schedule</th>
              <th class="py-3 px-4 text-left">Category</th>
              <th class="py-3 px-4 text-left">Action</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="course in enrolledCourses" :key="course.id">
              <tr class="border-b hover:bg-gray-50">
                <td class="py-3 px-4" x-text="course.code"></td>
                <td class="py-3 px-4" x-text="course.name"></td>
                <td class="py-3 px-4" x-text="course.instructor"></td>
                <td class="py-3 px-4" x-text="course.credits"></td>
                <td class="py-3 px-4" x-text="course.schedule"></td>
                <td class="py-3 px-4" x-text="course.category"></td>
                <td class="py-3 px-4">
                  <button 
                    @click="dropCourse(course)"
                    class="bg-red-500 hover:bg-red-600 text-white py-1 px-3 rounded-md text-sm"
                  >
                    Drop
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
        
        <div class="mt-4 p-4 bg-gray-50 rounded-md">
          <div class="flex justify-between items-center">
            <p class="font-medium">Total Credits: <span x-text="totalCredits" class="font-bold"></span></p>
            <p class="font-medium">Total Courses: <span x-text="enrolledCourses.length" class="font-bold"></span></p>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Notification -->
    <div
      x-show="notification.show"
      x-transition:enter="transition ease-out duration-300"
      x-transition:enter-start="opacity-0 transform scale-90"
      x-transition:enter-end="opacity-100 transform scale-100"
      x-transition:leave="transition ease-in duration-300"
      x-transition:leave-start="opacity-100 transform scale-100"
      x-transition:leave-end="opacity-0 transform scale-90"
      class="fixed bottom-4 right-4 px-6 py-3 rounded-md shadow-md"
      :class="notification.type === 'success' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'"
    >
      <p x-text="notification.message"></p>
    </div>
  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('courseEnrollment', () => ({
        availableCourses: [
          {
            id: 1,
            code: 'CS101',
            name: 'Introduction to Programming',
            instructor: 'Dr. John Smith',
            credits: 3,
            schedule: 'Mon, Wed 10:00 AM - 11:30 AM',
            category: 'Computer Science',
            availableSlots: 30
          },
          {
            id: 2,
            code: 'MATH201',
            name: 'Calculus I',
            instructor: 'Dr. Sarah Johnson',
            credits: 4,
            schedule: 'Tue, Thu 9:00 AM - 11:00 AM',
            category: 'Mathematics',
            availableSlots: 25
          },
          {
            id: 3,
            code: 'BIO150',
            name: 'General Biology',
            instructor: 'Prof. Michael Brown',
            credits: 4,
            schedule: 'Mon, Wed, Fri 2:00 PM - 3:30 PM',
            category: 'Biology',
            availableSlots: 20
          },
          {
            id: 4,
            code: 'CS250',
            name: 'Data Structures and Algorithms',
            instructor: 'Dr. Lisa Chen',
            credits: 4,
            schedule: 'Tue, Thu 1:00 PM - 3:00 PM',
            category: 'Computer Science',
            availableSlots: 22
          },
          {
            id: 5,
            code: 'LIT120',
            name: 'World Literature',
            instructor: 'Prof. David Wilson',
            credits: 3,
            schedule: 'Mon, Wed 3:00 PM - 4:30 PM',
            category: 'Literature',
            availableSlots: 35
          },
          {
            id: 6,
            code: 'HIST110',
            name: 'Modern World History',
            instructor: 'Dr. Emily Davis',
            credits: 3,
            schedule: 'Wed, Fri 11:00 AM - 12:30 PM',
            category: 'History',
            availableSlots: 40
          },
          {
            id: 7,
            code: 'MATH150',
            name: 'Linear Algebra',
            instructor: 'Dr. Robert Taylor',
            credits: 3,
            schedule: 'Mon, Fri 8:00 AM - 9:30 AM',
            category: 'Mathematics',
            availableSlots: 28
          },
          {
            id: 8,
            code: 'CS330',
            name: 'Web Development',
            instructor: 'Prof. Jessica Lopez',
            credits: 3,
            schedule: 'Tue, Thu 4:00 PM - 5:30 PM',
            category: 'Computer Science',
            availableSlots: 25
          }
        ],
        enrolledCourses: [],
        searchTerm: '',
        filterCategory: '',
        notification: {
          show: false,
          message: '',
          type: 'success'
        },
        
        get filteredCourses() {
          return this.availableCourses.filter(course => {
            const matchesSearch = this.searchTerm === '' || 
              course.name.toLowerCase().includes(this.searchTerm.toLowerCase()) ||
              course.code.toLowerCase().includes(this.searchTerm.toLowerCase()) ||
              course.instructor.toLowerCase().includes(this.searchTerm.toLowerCase());
            
            const matchesCategory = this.filterCategory === '' || 
              course.category === this.filterCategory;
            
            return matchesSearch && matchesCategory;
          });
        },
        
        get totalCredits() {
          return this.enrolledCourses.reduce((total, course) => total + course.credits, 0);
        },
        
        enrollCourse(course) {
          // Check if already enrolled
          if (this.isEnrolled(course.id)) {
            this.showNotification('You are already enrolled in this course.', 'error');
            return;
          }
          
          // Check if course is full
          if (course.availableSlots <= 0) {
            this.showNotification('This course is full.', 'error');
            return;
          }
          
          // Check for schedule conflicts
          const hasConflict = this.checkScheduleConflict(course);
          if (hasConflict) {
            this.showNotification('This course conflicts with your current schedule.', 'error');
            return;
          }
          
          // Check credit limit (max 18 credits)
          if (this.totalCredits + course.credits > 18) {
            this.showNotification('Enrolling in this course would exceed your credit limit of 18.', 'error');
            return;
          }
          
          // Find the course in available courses and decrease available slots
          const availableCourse = this.availableCourses.find(c => c.id === course.id);
          if (availableCourse) {
            availableCourse.availableSlots--;
          }
          
          // Add to enrolled courses
          this.enrolledCourses.push({...course});
          this.showNotification(`Successfully enrolled in ${course.name}.`, 'success');
          
          // Save to local storage
          this.saveEnrollmentData();
        },
        
        dropCourse(course) {
          // Find course in enrolled courses
          const index = this.enrolledCourses.findIndex(c => c.id === course.id);
          if (index !== -1) {
            this.enrolledCourses.splice(index, 1);
            
            // Find the course in available courses and increase available slots
            const availableCourse = this.availableCourses.find(c => c.id === course.id);
            if (availableCourse) {
              availableCourse.availableSlots++;
            }
            
            this.showNotification(`Successfully dropped ${course.name}.`, 'success');
            
            // Save to local storage
            this.saveEnrollmentData();
          }
        },
        
        isEnrolled(courseId) {
          return this.enrolledCourses.some(course => course.id === courseId);
        },
        
        checkScheduleConflict(newCourse) {
          // Simple schedule conflict check
          // In a real app, this would be more sophisticated
          for (const enrolledCourse of this.enrolledCourses) {
            if (enrolledCourse.schedule === newCourse.schedule) {
              return true;
            }
          }
          return false;
        },
        
        showNotification(message, type = 'success') {
          this.notification.message = message;
          this.notification.type = type;
          this.notification.show = true;
          
          // Hide notification after 3 seconds
          setTimeout(() => {
            this.notification.show = false;
          }, 3000);
        },
        
        saveEnrollmentData() {
          // Save enrollment data to local storage
          localStorage.setItem('enrolledCourses', JSON.stringify(this.enrolledCourses));
          localStorage.setItem('availableCourses', JSON.stringify(this.availableCourses));
        },
        
        loadEnrollmentData() {
          // Load enrollment data from local storage
          const enrolledCoursesData = localStorage.getItem('enrolledCourses');
          const availableCoursesData = localStorage.getItem('availableCourses');
          
          if (enrolledCoursesData) {
            this.enrolledCourses = JSON.parse(enrolledCoursesData);
          }
          
          if (availableCoursesData) {
            this.availableCourses = JSON.parse(availableCoursesData);
          }
        },
        
        init() {
          this.loadEnrollmentData();
        }
      }));
    });
  </script>
</body>
</html>
