<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance Distribution - Analytics Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .stat-card {
      transition: all 0.3s ease;
    }
    .stat-card:hover {
      transform: translateY(-2px);
    }
    .chart-container {
      position: relative;
      height: 300px;
      width: 100%;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Header -->
  <header class="bg-white shadow">
    <div class="container mx-auto px-4 py-6">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-2xl font-bold text-gray-800">Performance Distribution</h1>
          <p class="text-gray-600">Analytics and Insights Dashboard</p>
        </div>
        <div class="flex items-center space-x-4">
          <button id="exportBtn" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition">
            <i class="fas fa-download mr-2"></i>Export Report
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto px-4 py-8">
    <!-- Filters -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-8">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Department</label>
          <select id="departmentFilter" class="w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200">
            <option value="">All Departments</option>
            <option value="CS">Computer Science</option>
            <option value="EE">Electrical Engineering</option>
            <option value="ME">Mechanical Engineering</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Course</label>
          <select id="courseFilter" class="w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200">
            <option value="">All Courses</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Semester</label>
          <select id="semesterFilter" class="w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200">
            <option value="">All Semesters</option>
            <option value="1">1st Semester</option>
            <option value="2">2nd Semester</option>
            <option value="3">3rd Semester</option>
            <option value="4">4th Semester</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Academic Year</label>
          <select id="yearFilter" class="w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200">
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2022">2022</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
      <div class="bg-white rounded-lg shadow p-6 stat-card">
        <div class="flex items-center">
          <div class="p-3 rounded-full bg-blue-100 text-blue-600 mr-4">
            <i class="fas fa-users"></i>
          </div>
          <div>
            <p class="text-sm text-gray-600">Total Students</p>
            <p class="text-2xl font-bold text-gray-800" id="totalStudents">0</p>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-lg shadow p-6 stat-card">
        <div class="flex items-center">
          <div class="p-3 rounded-full bg-green-100 text-green-600 mr-4">
            <i class="fas fa-chart-line"></i>
          </div>
          <div>
            <p class="text-sm text-gray-600">Average Score</p>
            <p class="text-2xl font-bold text-gray-800" id="averageScore">0.00</p>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-lg shadow p-6 stat-card">
        <div class="flex items-center">
          <div class="p-3 rounded-full bg-yellow-100 text-yellow-600 mr-4">
            <i class="fas fa-percentage"></i>
          </div>
          <div>
            <p class="text-sm text-gray-600">Pass Rate</p>
            <p class="text-2xl font-bold text-gray-800" id="passRate">0%</p>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-lg shadow p-6 stat-card">
        <div class="flex items-center">
          <div class="p-3 rounded-full bg-purple-100 text-purple-600 mr-4">
            <i class="fas fa-trophy"></i>
          </div>
          <div>
            <p class="text-sm text-gray-600">Top Grade (A+)</p>
            <p class="text-2xl font-bold text-gray-800" id="topGrade">0%</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Charts Section -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
      <!-- Grade Distribution Chart -->
      <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Grade Distribution</h2>
        <div class="chart-container">
          <canvas id="gradeDistributionChart"></canvas>
        </div>
      </div>
      
      <!-- Performance Trend Chart -->
      <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Performance Trend</h2>
        <div class="chart-container">
          <canvas id="performanceTrendChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Detailed Analysis -->
    <div class="bg-white rounded-lg shadow-md overflow-hidden">
      <div class="p-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Performance Breakdown</h2>
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Grade Range</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Count</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Percentage</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Trend</th>
              </tr>
            </thead>
            <tbody id="analysisTableBody" class="bg-white divide-y divide-gray-200">
              <!-- Table content will be dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Mock data
      const performanceData = {
        grades: {
          'A+': 15,
          'A': 25,
          'A-': 30,
          'B+': 40,
          'B': 45,
          'B-': 35,
          'C+': 30,
          'C': 25,
          'C-': 20,
          'D': 15,
          'F': 10
        },
        trend: {
          labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4', 'Week 5'],
          data: [75, 78, 76, 79, 80]
        }
      };

      // Initialize charts
      initializeCharts(performanceData);
      updateStats(performanceData);
      populateAnalysisTable(performanceData);

      // Event listeners for filters
      document.getElementById('departmentFilter').addEventListener('change', handleFilterChange);
      document.getElementById('courseFilter').addEventListener('change', handleFilterChange);
      document.getElementById('semesterFilter').addEventListener('change', handleFilterChange);
      document.getElementById('yearFilter').addEventListener('change', handleFilterChange);

      // Export button handler
      document.getElementById('exportBtn').addEventListener('click', handleExport);

      function initializeCharts(data) {
        // Grade Distribution Chart
        const gradeCtx = document.getElementById('gradeDistributionChart').getContext('2d');
        new Chart(gradeCtx, {
          type: 'bar',
          data: {
            labels: Object.keys(data.grades),
            datasets: [{
              label: 'Number of Students',
              data: Object.values(data.grades),
              backgroundColor: 'rgba(79, 70, 229, 0.6)',
              borderColor: 'rgba(79, 70, 229, 1)',
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true
              }
            }
          }
        });

        // Performance Trend Chart
        const trendCtx = document.getElementById('performanceTrendChart').getContext('2d');
        new Chart(trendCtx, {
          type: 'line',
          data: {
            labels: data.trend.labels,
            datasets: [{
              label: 'Average Score',
              data: data.trend.data,
              borderColor: 'rgba(16, 185, 129, 1)',
              backgroundColor: 'rgba(16, 185, 129, 0.1)',
              tension: 0.4,
              fill: true
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true,
                max: 100
              }
            }
          }
        });
      }

      function updateStats(data) {
        const totalStudents = Object.values(data.grades).reduce((a, b) => a + b, 0);
        const passCount = Object.entries(data.grades)
          .filter(([grade]) => grade !== 'F')
          .reduce((sum, [_, count]) => sum + count, 0);
        
        document.getElementById('totalStudents').textContent = totalStudents;
        document.getElementById('averageScore').textContent = calculateAverage(data.trend.data).toFixed(2);
        document.getElementById('passRate').textContent = `${((passCount / totalStudents) * 100).toFixed(1)}%`;
        document.getElementById('topGrade').textContent = `${((data.grades['A+'] / totalStudents) * 100).toFixed(1)}%`;
      }

      function populateAnalysisTable(data) {
        const totalStudents = Object.values(data.grades).reduce((a, b) => a + b, 0);
        const tbody = document.getElementById('analysisTableBody');
        
        tbody.innerHTML = Object.entries(data.grades).map(([grade, count]) => `
          <tr>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${grade}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${count}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
              ${((count / totalStudents) * 100).toFixed(1)}%
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
              <span class="text-green-600"><i class="fas fa-arrow-up"></i> 2.3%</span>
            </td>
          </tr>
        `).join('');
      }

      function calculateAverage(numbers) {
        return numbers.reduce((a, b) => a + b, 0) / numbers.length;
      }

      function handleFilterChange() {
        // In a real application, this would fetch new data based on filters
        // For demo, we'll just show a loading state
        const elements = ['totalStudents', 'averageScore', 'passRate', 'topGrade'];
        elements.forEach(id => {
          document.getElementById(id).innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        });

        setTimeout(() => {
          updateStats(performanceData);
        }, 500);
      }

      function handleExport() {
        // In a real application, this would generate and download a report
        alert('Generating performance report...');
      }
    });
  </script>
</body>
</html>
