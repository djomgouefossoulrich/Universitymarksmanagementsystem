<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Management</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.0/cdn.min.js" defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <div x-data="studentProfile()" class="container mx-auto px-4 py-8">
        <div class="bg-white shadow-lg rounded-lg overflow-hidden max-w-4xl mx-auto">
            <!-- Header -->
            <div class="bg-blue-600 text-white p-6">
                <h1 class="text-2xl font-bold">Student Profile Management</h1>
                <p class="mt-1">Manage your personal information</p>
            </div>

            <!-- Profile Content -->
            <div class="p-6">
                <!-- Navigation Tabs -->
                <div class="flex border-b mb-6">
                    <button @click="activeTab = 'profile'" :class="{'text-blue-600 border-b-2 border-blue-600 font-medium': activeTab === 'profile'}" class="px-4 py-2 mr-4">Profile Information</button>
                    <button @click="activeTab = 'academic'" :class="{'text-blue-600 border-b-2 border-blue-600 font-medium': activeTab === 'academic'}" class="px-4 py-2 mr-4">Academic Details</button>
                    <button @click="activeTab = 'contact'" :class="{'text-blue-600 border-b-2 border-blue-600 font-medium': activeTab === 'contact'}" class="px-4 py-2">Contact Information</button>
                </div>

                <!-- Status Messages -->
                <div x-show="successMessage" class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-6" role="alert">
                    <p x-text="successMessage"></p>
                </div>

                <!-- Profile Tab -->
                <div x-show="activeTab === 'profile'" class="space-y-6">
                    <div class="flex flex-col md:flex-row gap-6">
                        <!-- Profile Picture Section -->
                        <div class="md:w-1/3 flex flex-col items-center">
                            <div class="w-40 h-40 rounded-full bg-gray-300 overflow-hidden mb-4">
                                <img x-show="profileData.photo" :src="profileData.photo" alt="Profile Photo" class="w-full h-full object-cover">
                                <div x-show="!profileData.photo" class="w-full h-full flex items-center justify-center text-gray-500">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                    </svg>
                                </div>
                            </div>
                            <label for="photo-upload" class="cursor-pointer bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md transition-colors">
                                Upload Photo
                            </label>
                            <input id="photo-upload" type="file" accept="image/*" class="hidden" @change="uploadPhoto">
                        </div>

                        <!-- Basic Info Section -->
                        <div class="md:w-2/3">
                            <h2 class="text-xl font-semibold mb-4">Basic Information</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" :class="{'pointer-events-none opacity-75': !isEditing}">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                                    <input type="text" x-model="profileData.firstName" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditing">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                                    <input type="text" x-model="profileData.lastName" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditing">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Student ID</label>
                                    <input type="text" x-model="profileData.studentId" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditing">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Date of Birth</label>
                                    <input type="date" x-model="profileData.dateOfBirth" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditing">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
                                    <select x-model="profileData.gender" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditing">
                                        <option value="">Select Gender</option>
                                        <option value="male">Male</option>
                                        <option value="female">Female</option>
                                        <option value="other">Other</option>
                                        <option value="prefer-not-to-say">Prefer not to say</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Nationality</label>
                                    <input type="text" x-model="profileData.nationality" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditing">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="pt-4 mt-4 border-t flex justify-end">
                        <button x-show="!isEditing" @click="isEditing = true" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md transition-colors">
                            Edit Profile
                        </button>
                        <template x-if="isEditing">
                            <div class="flex space-x-4">
                                <button @click="cancelEdit()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 py-2 px-4 rounded-md transition-colors">
                                    Cancel
                                </button>
                                <button @click="saveProfile()" class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-md transition-colors">
                                    Save Changes
                                </button>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Academic Tab -->
                <div x-show="activeTab === 'academic'" class="space-y-6">
                    <h2 class="text-xl font-semibold mb-4">Academic Information</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" :class="{'pointer-events-none opacity-75': !isEditingAcademic}">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Major/Program</label>
                            <input type="text" x-model="academicData.major" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditingAcademic">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
                            <input type="text" x-model="academicData.department" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditingAcademic">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Enrollment Year</label>
                            <input type="number" x-model="academicData.enrollmentYear" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditingAcademic">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Expected Graduation Year</label>
                            <input type="number" x-model="academicData.graduationYear" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditingAcademic">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Current GPA</label>
                            <input type="number" step="0.01" min="0" max="4.0" x-model="academicData.gpa" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditingAcademic">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Academic Status</label>
                            <select x-model="academicData.status" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditingAcademic">
                                <option value="active">Active</option>
                                <option value="on-leave">On Leave</option>
                                <option value="graduated">Graduated</option>
                                <option value="withdrawn">Withdrawn</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-8">
                        <h3 class="text-lg font-medium mb-4">Current Course Enrollments</h3>
                        <div x-show="isEditingAcademic" class="mb-4 flex flex-col md:flex-row gap-4">
                            <input type="text" x-model="newCourse.code" placeholder="Course Code" class="flex-1 px-3 py-2 border rounded-md">
                            <input type="text" x-model="newCourse.name" placeholder="Course Name" class="flex-1 px-3 py-2 border rounded-md">
                            <button @click="addCourse()" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md transition-colors">
                                Add Course
                            </button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Course Code</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Course Name</th>
                                        <th x-show="isEditingAcademic" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-gray-200">
                                    <template x-for="(course, index) in academicData.courses" :key="index">
                                        <tr>
                                            <td class="px-6 py-4 whitespace-nowrap" x-text="course.code"></td>
                                            <td class="px-6 py-4 whitespace-nowrap" x-text="course.name"></td>
                                            <td x-show="isEditingAcademic" class="px-6 py-4 whitespace-nowrap">
                                                <button @click="removeCourse(index)" class="text-red-600 hover:text-red-800">
                                                    Remove
                                                </button>
                                            </td>
                                        </tr>
                                    </template>
                                    <tr x-show="academicData.courses.length === 0">
                                        <td colspan="3" class="px-6 py-4 text-center text-gray-500">No courses added yet</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="pt-4 mt-4 border-t flex justify-end">
                        <button x-show="!isEditingAcademic" @click="isEditingAcademic = true" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md transition-colors">
                            Edit Academic Info
                        </button>
                        <template x-if="isEditingAcademic">
                            <div class="flex space-x-4">
                                <button @click="cancelEditAcademic()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 py-2 px-4 rounded-md transition-colors">
                                    Cancel
                                </button>
                                <button @click="saveAcademic()" class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-md transition-colors">
                                    Save Changes
                                </button>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Contact Tab -->
                <div x-show="activeTab === 'contact'" class="space-y-6">
                    <h2 class="text-xl font-semibold mb-4">Contact Information</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" :class="{'pointer-events-none opacity-75': !isEditingContact}">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                            <input type="email" x-model="contactData.email" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditingContact">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                            <input type="tel" x-model="contactData.phone" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditingContact">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
                            <textarea x-model="contactData.address" rows="3" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditingContact"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
                            <input type="text" x-model="contactData.city" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditingContact">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Postal/ZIP Code</label>
                            <input type="text" x-model="contactData.postalCode" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditingContact">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">State/Province</label>
                            <input type="text" x-model="contactData.state" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditingContact">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Country</label>
                            <input type="text" x-model="contactData.country" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditingContact">
                        </div>
                    </div>

                    <div class="mt-6">
                        <h3 class="text-lg font-medium mb-3">Emergency Contact</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" :class="{'pointer-events-none opacity-75': !isEditingContact}">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Contact Name</label>
                                <input type="text" x-model="contactData.emergency.name" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditingContact">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Relationship</label>
                                <input type="text" x-model="contactData.emergency.relationship" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditingContact">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                                <input type="tel" x-model="contactData.emergency.phone" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditingContact">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                                <input type="email" x-model="contactData.emergency.email" class="w-full px-3 py-2 border rounded-md" :disabled="!isEditingContact">
                            </div>
                        </div>
                    </div>

                    <div class="pt-4 mt-4 border-t flex justify-end">
                        <button x-show="!isEditingContact" @click="isEditingContact = true" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md transition-colors">
                            Edit Contact Info
                        </button>
                        <template x-if="isEditingContact">
                            <div class="flex space-x-4">
                                <button @click="cancelEditContact()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 py-2 px-4 rounded-md transition-colors">
                                    Cancel
                                </button>
                                <button @click="saveContact()" class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-md transition-colors">
                                    Save Changes
                                </button>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function studentProfile() {
            return {
                activeTab: 'profile',
                isEditing: false,
                isEditingAcademic: false,
                isEditingContact: false,
                successMessage: '',
                
                // Backup data for cancellation
                profileBackup: null,
                academicBackup: null,
                contactBackup: null,
                
                // Profile data
                profileData: {
                    firstName: 'John',
                    lastName: 'Doe',
                    studentId: 'STU123456',
                    dateOfBirth: '2000-01-15',
                    gender: 'male',
                    nationality: 'United States',
                    photo: null
                },
                
                // Academic data
                academicData: {
                    major: 'Computer Science',
                    department: 'School of Engineering',
                    enrollmentYear: 2022,
                    graduationYear: 2026,
                    gpa: 3.75,
                    status: 'active',
                    courses: [
                        { code: 'CS101', name: 'Introduction to Programming' },
                        { code: 'MATH201', name: 'Calculus II' }
                    ]
                },
                
                // Contact data
                contactData: {
                    email: 'john.doe@university.edu',
                    phone: '(555) 123-4567',
                    address: '123 Campus Drive',
                    city: 'University City',
                    state: 'CA',
                    postalCode: '90210',
                    country: 'United States',
                    emergency: {
                        name: 'Jane Doe',
                        relationship: 'Parent',
                        phone: '(555) 987-6543',
                        email: 'jane.doe@example.com'
                    }
                },
                
                // New course temp data
                newCourse: {
                    code: '',
                    name: ''
                },
                
                // Methods
                uploadPhoto(event) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            this.profileData.photo = e.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                },
                
                // Profile Methods
                saveProfile() {
                    // In a real application, you would send this data to a server
                    console.log('Saving profile data:', this.profileData);
                    this.isEditing = false;
                    this.showSuccessMessage('Profile information saved successfully!');
                    this.profileBackup = null;
                },
                
                cancelEdit() {
                    if (this.profileBackup) {
                        this.profileData = JSON.parse(this.profileBackup);
                        this.profileBackup = null;
                    }
                    this.isEditing = false;
                },
                
                // Academic Methods
                saveAcademic() {
                    console.log('Saving academic data:', this.academicData);
                    this.isEditingAcademic = false;
                    this.showSuccessMessage('Academic information saved successfully!');
                    this.academicBackup = null;
                },
                
                cancelEditAcademic() {
                    if (this.academicBackup) {
                        this.academicData = JSON.parse(this.academicBackup);
                        this.academicBackup = null;
                    }
                    this.isEditingAcademic = false;
                },
                
                addCourse() {
                    if (this.newCourse.code && this.newCourse.name) {
                        this.academicData.courses.push({
                            code: this.newCourse.code,
                            name: this.newCourse.name
                        });
                        this.newCourse.code = '';
                        this.newCourse.name = '';
                    }
                },
                
                removeCourse(index) {
                    this.academicData.courses.splice(index, 1);
                },
                
                // Contact Methods
                saveContact() {
                    console.log('Saving contact data:', this.contactData);
                    this.isEditingContact = false;
                    this.showSuccessMessage('Contact information saved successfully!');
                    this.contactBackup = null;
                },
                
                cancelEditContact() {
                    if (this.contactBackup) {
                        this.contactData = JSON.parse(this.contactBackup);
                        this.contactBackup = null;
                    }
                    this.isEditingContact = false;
                },
                
                // Utility Methods
                showSuccessMessage(message) {
                    this.successMessage = message;
                    setTimeout(() => {
                        this.successMessage = '';
                    }, 3000);
                },
                
                // Watchers
                init() {
                    // Load data from localStorage if available
                    const savedProfile = localStorage.getItem('studentProfile');
                    const savedAcademic = localStorage.getItem('studentAcademic');
                    const savedContact = localStorage.getItem('studentContact');
                    
                    if (savedProfile) this.profileData = JSON.parse(savedProfile);
                    if (savedAcademic) this.academicData = JSON.parse(savedAcademic);
                    if (savedContact) this.contactData = JSON.parse(savedContact);
                    
                    // Set up watchers for edit mode
                    this.$watch('isEditing', (value) => {
                        if (value) {
                            // Create backup of current data
                            this.profileBackup = JSON.stringify(this.profileData);
                        }
                    });
                    
                    this.$watch('isEditingAcademic', (value) => {
                        if (value) {
                            this.academicBackup = JSON.stringify(this.academicData);
                        }
                    });
                    
                    this.$watch('isEditingContact', (value) => {
                        if (value) {
                            this.contactBackup = JSON.stringify(this.contactData);
                        }
                    });
                    
                    // Save to localStorage when data changes
                    this.$watch('profileData', (value) => {
                        localStorage.setItem('studentProfile', JSON.stringify(value));
                    }, { deep: true });
                    
                    this.$watch('academicData', (value) => {
                        localStorage.setItem('studentAcademic', JSON.stringify(value));
                    }, { deep: true });
                    
                    this.$watch('contactData', (value) => {
                        localStorage.setItem('studentContact', JSON.stringify(value));
                    }, { deep: true });
                }
            };
        }
    </script>
</body>
</html>
