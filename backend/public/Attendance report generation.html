<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-center text-blue-800">Lecturer Attendance Management System</h1>
        </header>
        
        <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div>
                    <label for="classSelect" class="block text-sm font-medium text-gray-700 mb-1">Select Class</label>
                    <select id="classSelect" class="w-full p-2 border border-gray-300 rounded-md">
                        <option value="">Select a class</option>
                        <option value="cs101">CS101 - Introduction to Programming</option>
                        <option value="cs201">CS201 - Data Structures</option>
                        <option value="cs301">CS301 - Database Systems</option>
                    </select>
                </div>
                
                <div>
                    <label for="dateSelect" class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                    <input type="date" id="dateSelect" class="w-full p-2 border border-gray-300 rounded-md">
                </div>
                
                <div>
                    <label for="sessionSelect" class="block text-sm font-medium text-gray-700 mb-1">Session</label>
                    <select id="sessionSelect" class="w-full p-2 border border-gray-300 rounded-md">
                        <option value="morning">Morning (8:00 - 10:00)</option>
                        <option value="afternoon">Afternoon (13:00 - 15:00)</option>
                        <option value="evening">Evening (17:00 - 19:00)</option>
                    </select>
                </div>
            </div>
            
            <div class="mb-6">
                <button id="loadStudentsBtn" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">Load Students</button>
            </div>
        </div>
        
        <div id="attendanceContainer" class="hidden bg-white rounded-lg shadow-lg p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4">Attendance Sheet</h2>
            
            <div class="overflow-x-auto">
                <table id="attendanceTable" class="min-w-full bg-white">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700">
                            <th class="py-2 px-4 text-left">Student ID</th>
                            <th class="py-2 px-4 text-left">Name</th>
                            <th class="py-2 px-4 text-center">Present</th>
                            <th class="py-2 px-4 text-center">Absent</th>
                            <th class="py-2 px-4 text-center">Late</th>
                            <th class="py-2 px-4 text-left">Notes</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                        <!-- Student rows will be added here dynamically -->
                    </tbody>
                </table>
            </div>
            
            <div class="mt-6 flex justify-between">
                <button id="saveAttendanceBtn" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition">Save Attendance</button>
                <button id="generateReportBtn" class="bg-purple-600 text-white px-4 py-2 rounded-md hover:bg-purple-700 transition">Generate Report</button>
            </div>
        </div>

        <div id="reportsContainer" class="hidden bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Class Attendance Summary</h2>
            
            <div class="mb-6">
                <label for="reportClassSelect" class="block text-sm font-medium text-gray-700 mb-1">Select Class for Report</label>
                <select id="reportClassSelect" class="w-full p-2 border border-gray-300 rounded-md mb-4">
                    <option value="">Select a class</option>
                    <option value="cs101">CS101 - Introduction to Programming</option>
                    <option value="cs201">CS201 - Data Structures</option>
                    <option value="cs301">CS301 - Database Systems</option>
                </select>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label for="startDate" class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
                        <input type="date" id="startDate" class="w-full p-2 border border-gray-300 rounded-md">
                    </div>
                    
                    <div>
                        <label for="endDate" class="block text-sm font-medium text-gray-700 mb-1">End Date</label>
                        <input type="date" id="endDate" class="w-full p-2 border border-gray-300 rounded-md">
                    </div>
                </div>
                
                <button id="viewReportBtn" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">View Report</button>
            </div>
            
            <div id="reportSummary" class="hidden">
                <h3 class="text-lg font-medium mb-2">Attendance Summary</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div class="bg-blue-100 p-4 rounded-md">
                        <p class="text-sm text-blue-700">Total Classes</p>
                        <p id="totalClasses" class="text-2xl font-bold text-blue-800">0</p>
                    </div>
                    <div class="bg-green-100 p-4 rounded-md">
                        <p class="text-sm text-green-700">Average Attendance</p>
                        <p id="avgAttendance" class="text-2xl font-bold text-green-800">0%</p>
                    </div>
                    <div class="bg-yellow-100 p-4 rounded-md">
                        <p class="text-sm text-yellow-700">Students at Risk</p>
                        <p id="studentsAtRisk" class="text-2xl font-bold text-yellow-800">0</p>
                    </div>
                </div>
                
                <div class="overflow-x-auto">
                    <table id="reportTable" class="min-w-full bg-white">
                        <thead>
                            <tr class="bg-gray-200 text-gray-700">
                                <th class="py-2 px-4 text-left">Student ID</th>
                                <th class="py-2 px-4 text-left">Name</th>
                                <th class="py-2 px-4 text-center">Attendance %</th>
                                <th class="py-2 px-4 text-center">Present</th>
                                <th class="py-2 px-4 text-center">Absent</th>
                                <th class="py-2 px-4 text-center">Late</th>
                            </tr>
                        </thead>
                        <tbody id="reportTableBody">
                            <!-- Report rows will be added here dynamically -->
                        </tbody>
                    </table>
                </div>
                
                <div class="mt-6">
                    <button id="downloadReportBtn" class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700 transition">Download PDF Report</button>
                </div>
            </div>
        </div>
        
        <nav class="mt-8 flex justify-center">
            <ul class="flex space-x-4">
                <li>
                    <button id="navAttendance" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 transition">Take Attendance</button>
                </li>
                <li>
                    <button id="navReports" class="bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600 transition">View Reports</button>
                </li>
            </ul>
        </nav>
    </div>

    <script>
        // Database simulation
        const classesDb = {
            cs101: {
                name: "Introduction to Programming",
                students: [
                    { id: "CS101-001", name: "John Smith" },
                    { id: "CS101-002", name: "Emma Johnson" },
                    { id: "CS101-003", name: "Michael Brown" },
                    { id: "CS101-004", name: "Sophia Davis" },
                    { id: "CS101-005", name: "William Jones" },
                    { id: "CS101-006", name: "Olivia Miller" },
                    { id: "CS101-007", name: "James Wilson" },
                    { id: "CS101-008", name: "Ava Moore" },
                    { id: "CS101-009", name: "Alexander Taylor" },
                    { id: "CS101-010", name: "Charlotte Anderson" }
                ]
            },
            cs201: {
                name: "Data Structures",
                students: [
                    { id: "CS201-001", name: "Noah Martinez" },
                    { id: "CS201-002", name: "Isabella Thomas" },
                    { id: "CS201-003", name: "Ethan Hernandez" },
                    { id: "CS201-004", name: "Mia Robinson" },
                    { id: "CS201-005", name: "Daniel Clark" },
                    { id: "CS201-006", name: "Amelia Rodriguez" },
                    { id: "CS201-007", name: "Matthew Lewis" },
                    { id: "CS201-008", name: "Harper Walker" },
                    { id: "CS201-009", name: "Aiden Hall" },
                    { id: "CS201-010", name: "Evelyn Young" }
                ]
            },
            cs301: {
                name: "Database Systems",
                students: [
                    { id: "CS301-001", name: "Benjamin Allen" },
                    { id: "CS301-002", name: "Abigail King" },
                    { id: "CS301-003", name: "Jacob Wright" },
                    { id: "CS301-004", name: "Elizabeth Scott" },
                    { id: "CS301-005", name: "Lucas Green" },
                    { id: "CS301-006", name: "Emily Baker" },
                    { id: "CS301-007", name: "Henry Adams" },
                    { id: "CS301-008", name: "Avery Nelson" },
                    { id: "CS301-009", name: "Sofia Carter" },
                    { id: "CS301-010", name: "Leo Mitchell" }
                ]
            }
        };

        // Stored attendance records
        let attendanceRecords = {};

        // DOM Elements
        const loadStudentsBtn = document.getElementById('loadStudentsBtn');
        const attendanceContainer = document.getElementById('attendanceContainer');
        const attendanceTableBody = document.getElementById('attendanceTableBody');
        const saveAttendanceBtn = document.getElementById('saveAttendanceBtn');
        const generateReportBtn = document.getElementById('generateReportBtn');
        const reportsContainer = document.getElementById('reportsContainer');
        const reportSummary = document.getElementById('reportSummary');
        const viewReportBtn = document.getElementById('viewReportBtn');
        const downloadReportBtn = document.getElementById('downloadReportBtn');
        const navAttendance = document.getElementById('navAttendance');
        const navReports = document.getElementById('navReports');

        // Set today's date as default
        const today = new Date();
        const formattedDate = today.toISOString().split('T')[0];
        document.getElementById('dateSelect').value = formattedDate;
        document.getElementById('startDate').value = formattedDate;
        document.getElementById('endDate').value = formattedDate;

        // Event Listeners
        loadStudentsBtn.addEventListener('click', loadStudents);
        saveAttendanceBtn.addEventListener('click', saveAttendance);
        generateReportBtn.addEventListener('click', () => {
            attendanceContainer.classList.add('hidden');
            reportsContainer.classList.remove('hidden');
            navAttendance.classList.remove('bg-blue-500');
            navAttendance.classList.add('bg-gray-500');
            navReports.classList.remove('bg-gray-500');
            navReports.classList.add('bg-blue-500');
        });
        viewReportBtn.addEventListener('click', generateAttendanceReport);
        downloadReportBtn.addEventListener('click', downloadPdfReport);

        navAttendance.addEventListener('click', () => {
            attendanceContainer.classList.remove('hidden');
            reportsContainer.classList.add('hidden');
            navAttendance.classList.remove('bg-gray-500');
            navAttendance.classList.add('bg-blue-500');
            navReports.classList.remove('bg-blue-500');
            navReports.classList.add('bg-gray-500');
        });

        navReports.addEventListener('click', () => {
            attendanceContainer.classList.add('hidden');
            reportsContainer.classList.remove('hidden');
            navAttendance.classList.remove('bg-blue-500');
            navAttendance.classList.add('bg-gray-500');
            navReports.classList.remove('bg-gray-500');
            navReports.classList.add('bg-blue-500');
        });

        // Functions
        function loadStudents() {
            const classId = document.getElementById('classSelect').value;
            const date = document.getElementById('dateSelect').value;
            const session = document.getElementById('sessionSelect').value;
            
            if (!classId) {
                alert('Please select a class');
                return;
            }
            
            if (!date) {
                alert('Please select a date');
                return;
            }
            
            attendanceTableBody.innerHTML = '';
            
            const selectedClass = classesDb[classId];
            if (!selectedClass) {
                alert('Class not found');
                return;
            }
            
            const attendanceKey = `${classId}-${date}-${session}`;
            const existingAttendance = attendanceRecords[attendanceKey] || {};
            
            selectedClass.students.forEach(student => {
                const studentAttendance = existingAttendance[student.id] || { status: 'present', notes: '' };
                const row = document.createElement('tr');
                row.className = 'border-b border-gray-200 hover:bg-gray-100';
                
                row.innerHTML = `
                    <td class="py-2 px-4">${student.id}</td>
                    <td class="py-2 px-4">${student.name}</td>
                    <td class="py-2 px-4 text-center">
                        <input type="radio" name="status-${student.id}" value="present" ${studentAttendance.status === 'present' ? 'checked' : ''} class="h-4 w-4 text-blue-600">
                    </td>
                    <td class="py-2 px-4 text-center">
                        <input type="radio" name="status-${student.id}" value="absent" ${studentAttendance.status === 'absent' ? 'checked' : ''} class="h-4 w-4 text-blue-600">
                    </td>
                    <td class="py-2 px-4 text-center">
                        <input type="radio" name="status-${student.id}" value="late" ${studentAttendance.status === 'late' ? 'checked' : ''} class="h-4 w-4 text-blue-600">
                    </td>
                    <td class="py-2 px-4">
                        <input type="text" class="notes-input border rounded px-2 py-1 w-full" value="${studentAttendance.notes || ''}">
                    </td>
                `;
                
                attendanceTableBody.appendChild(row);
            });
            
            attendanceContainer.classList.remove('hidden');
        }
        
        function saveAttendance() {
            const classId = document.getElementById('classSelect').value;
            const date = document.getElementById('dateSelect').value;
            const session = document.getElementById('sessionSelect').value;
            
            if (!classId || !date) {
                alert('Please select a class and date');
                return;
            }
            
            const attendanceKey = `${classId}-${date}-${session}`;
            const attendance = {};
            
            const rows = attendanceTableBody.querySelectorAll('tr');
            rows.forEach(row => {
                const studentId = row.cells[0].textContent;
                const presentRadio = row.querySelector(`input[name="status-${studentId}"][value="present"]`);
                const absentRadio = row.querySelector(`input[name="status-${studentId}"][value="absent"]`);
                const lateRadio = row.querySelector(`input[name="status-${studentId}"][value="late"]`);
                const notesInput = row.querySelector('.notes-input');
                
                let status = 'present';
                if (absentRadio && absentRadio.checked) {
                    status = 'absent';
                } else if (lateRadio && lateRadio.checked) {
                    status = 'late';
                }
                
                attendance[studentId] = {
                    status: status,
                    notes: notesInput ? notesInput.value : ''
                };
            });
            
            attendanceRecords[attendanceKey] = attendance;
            alert('Attendance saved successfully!');
        }
        
        function generateAttendanceReport() {
            const classId = document.getElementById('reportClassSelect').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            if (!classId || !startDate || !endDate) {
                alert('Please select class and date range');
                return;
            }
            
            const selectedClass = classesDb[classId];
            if (!selectedClass) {
                alert('Class not found');
                return;
            }
            
            // Find attendance records for this class within the date range
            const relevantRecords = {};
            Object.keys(attendanceRecords).forEach(key => {
                if (key.startsWith(classId) && isDateInRange(key.split('-')[1], startDate, endDate)) {
                    relevantRecords[key] = attendanceRecords[key];
                }
            });
            
            const totalClasses = Object.keys(relevantRecords).length;
            
            if (totalClasses === 0) {
                alert('No attendance records found for this date range');
                return;
            }
            
            // Calculate attendance statistics for each student
            const studentStats = {};
            selectedClass.students.forEach(student => {
                studentStats[student.id] = {
                    id: student.id,
                    name: student.name,
                    present: 0,
                    absent: 0,
                    late: 0
                };
            });
            
            Object.values(relevantRecords).forEach(record => {
                Object.entries(record).forEach(([studentId, data]) => {
                    if (studentStats[studentId]) {
                        studentStats[studentId][data.status]++;
                    }
                });
            });
            
            // Calculate percentages and display in the report table
            const reportTableBody = document.getElementById('reportTableBody');
            reportTableBody.innerHTML = '';
            
            let studentsAtRisk = 0;
            
            Object.values(studentStats).forEach(stats => {
                const totalAttended = stats.present + (stats.late * 0.5);
                const attendancePercent = (totalAttended / totalClasses) * 100;
                
                if (attendancePercent < 75) {
                    studentsAtRisk++;
                }
                
                const row = document.createElement('tr');
                row.className = 'border-b border-gray-200 hover:bg-gray-100';
                
                row.innerHTML = `
                    <td class="py-2 px-4">${stats.id}</td>
                    <td class="py-2 px-4">${stats.name}</td>
                    <td class="py-2 px-4 text-center ${attendancePercent < 75 ? 'text-red-600 font-semibold' : ''}">${attendancePercent.toFixed(2)}%</td>
                    <td class="py-2 px-4 text-center">${stats.present}</td>
                    <td class="py-2 px-4 text-center">${stats.absent}</td>
                    <td class="py-2 px-4 text-center">${stats.late}</td>
                `;
                
                reportTableBody.appendChild(row);
            });
            
            // Update summary statistics
            document.getElementById('totalClasses').textContent = totalClasses;
            
            const totalStudents = selectedClass.students.length;
            const avgAttendance = Object.values(studentStats).reduce((sum, stats) => {
                return sum + ((stats.present + (stats.late * 0.5)) / totalClasses) * 100;
            }, 0) / totalStudents;
            
            document.getElementById('avgAttendance').textContent = `${avgAttendance.toFixed(2)}%`;
            document.getElementById('studentsAtRisk').textContent = studentsAtRisk;
            
            reportSummary.classList.remove('hidden');
        }
        
        function isDateInRange(dateStr, startDateStr, endDateStr) {
            const date = new Date(dateStr);
            const startDate = new Date(startDateStr);
            const endDate = new Date(endDateStr);
            endDate.setHours(23, 59, 59, 999); // Include the end date fully
            
            return date >= startDate && date <= endDate;
        }
        
        function downloadPdfReport() {
            const { jsPDF } = window.jspdf;
            const classId = document.getElementById('reportClassSelect').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            if (!classId || !startDate || !endDate) {
                alert('Please generate a report first');
                return;
            }
            
            // Create PDF document
            const doc = new jsPDF();
            
            // Add title
            doc.setFontSize(18);
            doc.text('Attendance Report', 105, 15, { align: 'center' });
            
            // Add report details
            doc.setFontSize(12);
            doc.text(`Class: ${classId} - ${classesDb[classId].name}`, 14, 25);
            doc.text(`Period: ${formatDate(startDate)} to ${formatDate(endDate)}`, 14, 32);
            doc.text(`Generated on: ${formatDate(new Date().toISOString().split('T')[0])}`, 14, 39);
            
            // Add summary statistics
            doc.setFontSize(14);
            doc.text('Summary', 14, 50);
            
            doc.setFontSize(11);
            doc.text(`Total Classes: ${document.getElementById('totalClasses').textContent}`, 14, 58);
            doc.text(`Average Attendance: ${document.getElementById('avgAttendance').textContent}`, 14, 65);
            doc.text(`Students at Risk: ${document.getElementById('studentsAtRisk').textContent}`, 14, 72);
            
            // Create attendance table
            const tableColumn = ["ID", "Name", "Attendance %", "Present", "Absent", "Late"];
            const tableRows = [];
            
            const rows = document.getElementById('reportTableBody').querySelectorAll('tr');
            rows.forEach(row => {
                const rowData = [];
                row.querySelectorAll('td').forEach(cell => {
                    rowData.push(cell.textContent);
                });
                tableRows.push(rowData);
            });
            
            // Add table to document
            doc.autoTable({
                head: [tableColumn],
                body: tableRows,
                startY: 80,
                styles: { fontSize: 10 },
                didDrawCell: (data) => {
                    // Highlight students at risk (attendance < 75%)
                    if (data.column.index === 2 && data.cell.raw < 75 && data.cell.section === 'body') {
                        doc.setTextColor(255, 0, 0);
                    } else {
                        doc.setTextColor(0, 0, 0);
                    }
                }
            });
            
            // Save PDF
            doc.save(`Attendance_Report_${classId}_${startDate}_to_${endDate}.pdf`);
        }
        
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }
    </script>
</body>
</html>
