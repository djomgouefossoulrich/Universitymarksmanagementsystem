<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Result Approval Workflow - Exam Controller</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .approval-card {
      transition: all 0.3s ease;
    }
    .approval-card:hover {
      transform: translateY(-2px);
    }
    .status-badge {
      transition: all 0.2s ease;
    }
    .status-badge:hover {
      transform: scale(1.05);
    }
    .comment-box {
      transition: height 0.3s ease;
    }
    .animate-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    .toast {
      transition: all 0.3s ease;
      transform: translateY(100%);
      opacity: 0;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Header -->
  <header class="bg-white shadow">
    <div class="container mx-auto px-4 py-6">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-2xl font-bold text-gray-800">Result Approval Workflow</h1>
          <p class="text-gray-600">Review and approve examination results</p>
        </div>
        <div class="flex items-center space-x-4">
          <select id="filterStatus" class="rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200">
            <option value="all">All Status</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
          <button id="refreshBtn" class="bg-gray-100 p-2 rounded-full hover:bg-gray-200 transition">
            <i class="fas fa-sync-alt"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto px-4 py-8">
    <!-- Stats Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
      <div class="bg-white rounded-lg shadow p-6">
        <div class="flex items-center">
          <div class="p-3 rounded-full bg-blue-100 text-blue-600 mr-4">
            <i class="fas fa-clock"></i>
          </div>
          <div>
            <p class="text-sm text-gray-600">Pending</p>
            <p class="text-2xl font-bold text-gray-800" id="pendingCount">0</p>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-lg shadow p-6">
        <div class="flex items-center">
          <div class="p-3 rounded-full bg-green-100 text-green-600 mr-4">
            <i class="fas fa-check"></i>
          </div>
          <div>
            <p class="text-sm text-gray-600">Approved</p>
            <p class="text-2xl font-bold text-gray-800" id="approvedCount">0</p>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-lg shadow p-6">
        <div class="flex items-center">
          <div class="p-3 rounded-full bg-red-100 text-red-600 mr-4">
            <i class="fas fa-times"></i>
          </div>
          <div>
            <p class="text-sm text-gray-600">Rejected</p>
            <p class="text-2xl font-bold text-gray-800" id="rejectedCount">0</p>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-lg shadow p-6">
        <div class="flex items-center">
          <div class="p-3 rounded-full bg-purple-100 text-purple-600 mr-4">
            <i class="fas fa-tasks"></i>
          </div>
          <div>
            <p class="text-sm text-gray-600">Total</p>
            <p class="text-2xl font-bold text-gray-800" id="totalCount">0</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Approval List -->
    <div class="space-y-6" id="approvalList">
      <!-- Approval cards will be added here dynamically -->
    </div>
  </main>

  <!-- Review Modal -->
  <div id="reviewModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full mx-4 transform transition-all">
      <div class="p-6">
        <div class="flex justify-between items-start mb-4">
          <h3 class="text-xl font-bold text-gray-900" id="modalTitle">Review Submission</h3>
          <button id="closeModal" class="text-gray-400 hover:text-gray-600">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="space-y-4">
          <div class="bg-gray-50 rounded-lg p-4">
            <h4 class="font-medium text-gray-700 mb-2">Submission Details</h4>
            <div id="modalDetails" class="text-sm text-gray-600"></div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Comments</label>
            <textarea id="reviewComment" rows="4" class="w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200" placeholder="Enter your comments here..."></textarea>
          </div>
          <div class="flex justify-end space-x-3">
            <button id="rejectBtn" class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition">
              Reject
            </button>
            <button id="approveBtn" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition">
              Approve
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Mock data for demonstration
      let submissions = [
        {
          id: 1,
          course: 'CS101: Introduction to Programming',
          instructor: 'Dr. John Smith',
          department: 'Computer Science',
          semester: 'Spring 2024',
          submittedDate: '2024-03-15T10:30:00',
          status: 'pending',
          students: 45,
          passRate: 88.5,
          averageGrade: 'B+',
          comments: []
        },
        {
          id: 2,
          course: 'EE201: Circuit Theory',
          instructor: 'Dr. Sarah Johnson',
          department: 'Electrical Engineering',
          semester: 'Spring 2024',
          submittedDate: '2024-03-14T15:45:00',
          status: 'approved',
          students: 38,
          passRate: 92.1,
          averageGrade: 'A-',
          comments: ['Excellent distribution of grades. Approved.']
        },
        {
          id: 3,
          course: 'ME301: Thermodynamics',
          instructor: 'Prof. Michael Brown',
          department: 'Mechanical Engineering',
          semester: 'Spring 2024',
          submittedDate: '2024-03-13T09:15:00',
          status: 'rejected',
          students: 42,
          passRate: 76.2,
          averageGrade: 'C+',
          comments: ['High failure rate needs justification. Please review and resubmit.']
        }
      ];

      // Cache DOM elements
      const filterStatus = document.getElementById('filterStatus');
      const refreshBtn = document.getElementById('refreshBtn');
      const approvalList = document.getElementById('approvalList');
      const reviewModal = document.getElementById('reviewModal');
      const closeModal = document.getElementById('closeModal');
      const modalTitle = document.getElementById('modalTitle');
      const modalDetails = document.getElementById('modalDetails');
      const reviewComment = document.getElementById('reviewComment');
      const approveBtn = document.getElementById('approveBtn');
      const rejectBtn = document.getElementById('rejectBtn');
      const toast = document.getElementById('toast');

      let currentSubmission = null;

      // Initialize
      updateStats();
      renderSubmissions();

      // Event Listeners
      filterStatus.addEventListener('change', renderSubmissions);
      refreshBtn.addEventListener('click', handleRefresh);
      closeModal.addEventListener('click', () => reviewModal.classList.add('hidden'));

      approveBtn.addEventListener('click', () => handleReview('approved'));
      rejectBtn.addEventListener('click', () => handleReview('rejected'));

      // Functions
      function updateStats() {
        const stats = {
          pending: submissions.filter(s => s.status === 'pending').length,
          approved: submissions.filter(s => s.status === 'approved').length,
          rejected: submissions.filter(s => s.status === 'rejected').length,
          total: submissions.length
        };

        document.getElementById('pendingCount').textContent = stats.pending;
        document.getElementById('approvedCount').textContent = stats.approved;
        document.getElementById('rejectedCount').textContent = stats.rejected;
        document.getElementById('totalCount').textContent = stats.total;
      }

      function renderSubmissions() {
        const status = filterStatus.value;
        const filtered = status === 'all' 
          ? submissions 
          : submissions.filter(s => s.status === status);

        approvalList.innerHTML = filtered.map(submission => `
          <div class="approval-card bg-white rounded-lg shadow-md overflow-hidden">
            <div class="p-6">
              <div class="flex justify-between items-start mb-4">
                <div>
                  <h3 class="text-lg font-semibold text-gray-800">${submission.course}</h3>
                  <p class="text-sm text-gray-600">${submission.instructor} • ${submission.department}</p>
                </div>
                <span class="status-badge px-3 py-1 rounded-full text-sm font-medium ${getStatusClasses(submission.status)}">
                  ${capitalizeFirst(submission.status)}
                </span>
              </div>
              
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div>
                  <p class="text-sm text-gray-600">Students</p>
                  <p class="text-lg font-semibold">${submission.students}</p>
                </div>
                <div>
                  <p class="text-sm text-gray-600">Pass Rate</p>
                  <p class="text-lg font-semibold">${submission.passRate}%</p>
                </div>
                <div>
                  <p class="text-sm text-gray-600">Average Grade</p>
                  <p class="text-lg font-semibold">${submission.averageGrade}</p>
                </div>
              </div>

              <div class="flex justify-between items-center">
                <p class="text-sm text-gray-500">
                  Submitted ${formatDate(submission.submittedDate)}
                </p>
                <button onclick="showReviewModal(${submission.id})" 
                  class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition">
                  Review
                </button>
              </div>
              
              ${submission.comments.length ? `
                <div class="mt-4 pt-4 border-t border-gray-200">
                  <p class="text-sm text-gray-600 mb-2">Latest Comment:</p>
                  <p class="text-sm text-gray-800">${submission.comments[submission.comments.length - 1]}</p>
                </div>
              ` : ''}
            </div>
          </div>
        `).join('');
      }

      function handleRefresh() {
        refreshBtn.classList.add('animate-pulse');
        
        // Simulate API refresh
        setTimeout(() => {
          refreshBtn.classList.remove('animate-pulse');
          renderSubmissions();
          showToast('Data refreshed successfully');
        }, 1000);
      }

      window.showReviewModal = (submissionId) => {
        currentSubmission = submissions.find(s => s.id === submissionId);
        if (!currentSubmission) return;

        modalTitle.textContent = currentSubmission.course;
        modalDetails.innerHTML = `
          <div class="grid grid-cols-2 gap-4">
            <div>
              <p class="font-medium">Instructor</p>
              <p>${currentSubmission.instructor}</p>
            </div>
            <div>
              <p class="font-medium">Department</p>
              <p>${currentSubmission.department}</p>
            </div>
            <div>
              <p class="font-medium">Semester</p>
              <p>${currentSubmission.semester}</p>
            </div>
            <div>
              <p class="font-medium">Students</p>
              <p>${currentSubmission.students}</p>
            </div>
            <div>
              <p class="font-medium">Pass Rate</p>
              <p>${currentSubmission.passRate}%</p>
            </div>
            <div>
              <p class="font-medium">Average Grade</p>
              <p>${currentSubmission.averageGrade}</p>
            </div>
          </div>
        `;

        reviewComment.value = '';
        reviewModal.classList.remove('hidden');
      }

      function handleReview(status) {
        if (!currentSubmission || !reviewComment.value.trim()) {
          showToast('Please add a comment before submitting', 'error');
          return;
        }

        currentSubmission.status = status;
        currentSubmission.comments.push(reviewComment.value.trim());

        updateStats();
        renderSubmissions();
        reviewModal.classList.add('hidden');

        showToast(`Result ${status} successfully`);
      }

      function showToast(message, type = 'success') {
        toast.className = `toast fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg ${
          type === 'error' ? 'bg-red-500' : 'bg-green-500'
        } text-white`;
        toast.textContent = message;
        toast.classList.add('show');
        
        setTimeout(() => {
          toast.classList.remove('show');
        }, 3000);
      }

      function getStatusClasses(status) {
        switch (status) {
          case 'pending':
            return 'bg-yellow-100 text-yellow-800';
          case 'approved':
            return 'bg-green-100 text-green-800';
          case 'rejected':
            return 'bg-red-100 text-red-800';
          default:
            return 'bg-gray-100 text-gray-800';
        }
      }

      function capitalizeFirst(string) {
        return string.charAt(0).toUpperCase() + string.slice(1);
      }

      function formatDate(dateString) {
        const date = new Date(dateString);
        return new Intl.DateTimeFormat('en-US', {
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        }).format(date);
      }
    });
  </script>
</body>
</html>
