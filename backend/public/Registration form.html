<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Enrollment System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto py-8">
        <div class="max-w-md mx-auto bg-white rounded-lg shadow-md overflow-hidden">
            <div class="bg-blue-600 text-white py-4 px-6">
                <h2 class="text-2xl font-bold">Course Enrollment System</h2>
                <p class="text-blue-100">Register for your courses</p>
            </div>
            
            <div class="p-6">
                <form id="enrollmentForm" class="space-y-6">
                    <!-- Student Information -->
                    <div>
                        <h3 class="text-lg font-medium text-gray-700 mb-4">Student Information</h3>
                        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                            <div>
                                <label for="studentId" class="block text-sm font-medium text-gray-700">Student ID/Matricul</label>
                                <input type="text" id="studentId" name="studentId" required
                                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                            </div>
                            <div>
                                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                                <input type="email" id="email" name="email" required
                                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                            </div>
                        </div>
                        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 mt-4">
                            <div>
                                <label for="firstName" class="block text-sm font-medium text-gray-700">First Name</label>
                                <input type="text" id="firstName" name="firstName" required
                                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                            </div>
                            <div>
                                <label for="lastName" class="block text-sm font-medium text-gray-700">Last Name</label>
                                <input type="text" id="lastName" name="lastName" required
                                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                            </div>
                        </div>
                    </div>

                    <!-- Course Selection -->
                    <div>
                        <h3 class="text-lg font-medium text-gray-700 mb-4">Course Selection</h3>
                        <div class="space-y-4" id="courseSelection">
                            <div id="course-container" class="space-y-4">
                                <div class="course-entry p-4 border border-gray-200 rounded-md">
                                    <div class="flex justify-between">
                                        <h4 class="text-md font-medium">Course 1</h4>
                                        <button type="button" class="remove-course text-red-500 hover:text-red-700" disabled>Remove</button>
                                    </div>
                                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 mt-2">
                                        <div>
                                            <label for="course1" class="block text-sm font-medium text-gray-700">Course</label>
                                            <select id="course1" name="courses[]" required
                                                class="mt-1 block w-full pl-3 pr-10 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                                                <option value="">Select Course</option>
                                                <option value="CSC101">CSC101 - Introduction to Computer Science</option>
                                                <option value="MAT201">MAT201 - Advanced Mathematics</option>
                                                <option value="PHY101">PHY101 - Physics I</option>
                                                <option value="ENG202">ENG202 - English Composition</option>
                                                <option value="HIS101">HIS101 - World History</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label for="section1" class="block text-sm font-medium text-gray-700">Section</label>
                                            <select id="section1" name="sections[]" required
                                                class="mt-1 block w-full pl-3 pr-10 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                                                <option value="">Select Section</option>
                                                <option value="A">Section A - MWF 9:00 AM</option>
                                                <option value="B">Section B - MWF 11:00 AM</option>
                                                <option value="C">Section C - TR 2:00 PM</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <button type="button" id="addCourse" class="flex items-center text-sm text-blue-600 hover:text-blue-800">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clip-rule="evenodd" />
                                </svg>
                                Add Another Course
                            </button>
                        </div>
                    </div>

                    <!-- Additional Information -->
                    <div>
                        <h3 class="text-lg font-medium text-gray-700 mb-4">Additional Information</h3>
                        <div class="space-y-4">
                            <div>
                                <label for="semester" class="block text-sm font-medium text-gray-700">Semester</label>
                                <select id="semester" name="semester" required
                                    class="mt-1 block w-full pl-3 pr-10 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                                    <option value="">Select Semester</option>
                                    <option value="Fall2025">Fall 2025</option>
                                    <option value="Spring2026">Spring 2026</option>
                                    <option value="Summer2026">Summer 2026</option>
                                </select>
                            </div>
                            <div>
                                <label for="comments" class="block text-sm font-medium text-gray-700">Special Requests or Comments</label>
                                <textarea id="comments" name="comments" rows="3"
                                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"></textarea>
                            </div>
                            <div class="flex items-start">
                                <div class="flex items-center h-5">
                                    <input id="termsAgreed" name="termsAgreed" type="checkbox" required
                                        class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                                </div>
                                <div class="ml-3 text-sm">
                                    <label for="termsAgreed" class="font-medium text-gray-700">I agree to the terms and conditions</label>
                                    <p class="text-gray-500">By enrolling, you agree to the academic policies of the institution.</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between">
                        <button type="button" id="clearForm" class="py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            Clear Form
                        </button>
                        <button type="submit" class="py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            Submit Enrollment
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Enrolled Courses Section -->
        <div class="max-w-md mx-auto mt-8 bg-white rounded-lg shadow-md overflow-hidden" id="enrolledCoursesSection" style="display:none;">
            <div class="bg-green-600 text-white py-4 px-6">
                <h2 class="text-2xl font-bold">Enrolled Courses</h2>
                <p class="text-green-100">Your current course enrollments</p>
            </div>
            
            <div class="p-6">
                <ul id="enrolledCoursesList" class="divide-y divide-gray-200">
                    <!-- Enrolled courses will be populated here -->
                </ul>
                
                <div class="mt-6">
                    <button type="button" id="enrollMore" class="text-blue-600 hover:text-blue-800">
                        + Enroll in more courses
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Get elements
            const form = document.getElementById('enrollmentForm');
            const addCourseBtn = document.getElementById('addCourse');
            const clearFormBtn = document.getElementById('clearForm');
            const courseContainer = document.getElementById('course-container');
            const enrolledCoursesSection = document.getElementById('enrolledCoursesSection');
            const enrolledCoursesList = document.getElementById('enrolledCoursesList');
            const enrollMoreBtn = document.getElementById('enrollMore');
            
            // Counter for course entries
            let courseCount = 1;
            
            // Add new course entry
            addCourseBtn.addEventListener('click', function() {
                courseCount++;
                
                const courseEntry = document.createElement('div');
                courseEntry.className = 'course-entry p-4 border border-gray-200 rounded-md';
                courseEntry.innerHTML = `
                    <div class="flex justify-between">
                        <h4 class="text-md font-medium">Course ${courseCount}</h4>
                        <button type="button" class="remove-course text-red-500 hover:text-red-700">Remove</button>
                    </div>
                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 mt-2">
                        <div>
                            <label for="course${courseCount}" class="block text-sm font-medium text-gray-700">Course</label>
                            <select id="course${courseCount}" name="courses[]" required
                                class="mt-1 block w-full pl-3 pr-10 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                                <option value="">Select Course</option>
                                <option value="CSC101">CSC101 - Introduction to Computer Science</option>
                                <option value="MAT201">MAT201 - Advanced Mathematics</option>
                                <option value="PHY101">PHY101 - Physics I</option>
                                <option value="ENG202">ENG202 - English Composition</option>
                                <option value="HIS101">HIS101 - World History</option>
                            </select>
                        </div>
                        <div>
                            <label for="section${courseCount}" class="block text-sm font-medium text-gray-700">Section</label>
                            <select id="section${courseCount}" name="sections[]" required
                                class="mt-1 block w-full pl-3 pr-10 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                                <option value="">Select Section</option>
                                <option value="A">Section A - MWF 9:00 AM</option>
                                <option value="B">Section B - MWF 11:00 AM</option>
                                <option value="C">Section C - TR 2:00 PM</option>
                            </select>
                        </div>
                    </div>
                `;
                
                courseContainer.appendChild(courseEntry);
                
                // Add remove functionality to the new course entry
                const removeBtn = courseEntry.querySelector('.remove-course');
                removeBtn.addEventListener('click', function() {
                    courseContainer.removeChild(courseEntry);
                });
            });
            
            // Enable remove buttons when there's more than one course
            document.addEventListener('click', function() {
                const removeBtns = document.querySelectorAll('.remove-course');
                const courseEntries = document.querySelectorAll('.course-entry');
                
                if (courseEntries.length > 1) {
                    removeBtns.forEach(btn => {
                        btn.disabled = false;
                    });
                } else {
                    removeBtns[0].disabled = true;
                }
            });
            
            // Clear form
            clearFormBtn.addEventListener('click', function() {
                form.reset();
                
                // Remove all course entries except the first one
                const courseEntries = document.querySelectorAll('.course-entry');
                for (let i = 1; i < courseEntries.length; i++) {
                    courseContainer.removeChild(courseEntries[i]);
                }
                courseCount = 1;
            });
            
            // Form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Validate form
                if (!form.checkValidity()) {
                    alert('Please fill in all required fields!');
                    return;
                }
                
                // Get form data
                const formData = new FormData(form);
                const courses = formData.getAll('courses[]');
                const sections = formData.getAll('sections[]');
                const studentInfo = {
                    id: formData.get('studentId'),
                    firstName: formData.get('firstName'),
                    lastName: formData.get('lastName'),
                    email: formData.get('email'),
                    semester: formData.get('semester')
                };
                
                // Display enrolled courses
                displayEnrolledCourses(studentInfo, courses, sections);
                
                // Reset form
                form.reset();
                
                // Hide form and show enrolled courses
                form.closest('.max-w-md').style.display = 'none';
                enrolledCoursesSection.style.display = 'block';
            });
            
            // Display enrolled courses
            function displayEnrolledCourses(studentInfo, courses, sections) {
                // Clear previous enrollments
                enrolledCoursesList.innerHTML = '';
                
                // Add student info
                const studentInfoElement = document.createElement('div');
                studentInfoElement.className = 'py-4';
                studentInfoElement.innerHTML = `
                    <h3 class="text-lg font-medium text-gray-700">${studentInfo.firstName} ${studentInfo.lastName}</h3>
                    <p class="text-sm text-gray-500">ID: ${studentInfo.id} | Email: ${studentInfo.email}</p>
                    <p class="text-sm text-gray-500">Semester: ${studentInfo.semester}</p>
                `;
                enrolledCoursesList.appendChild(studentInfoElement);
                
                // Add divider
                const divider = document.createElement('div');
                divider.className = 'border-t border-gray-200 my-2';
                enrolledCoursesList.appendChild(divider);
                
                // Add course enrollments
                courses.forEach((course, index) => {
                    const section = sections[index];
                    
                    const courseElement = document.createElement('li');
                    courseElement.className = 'py-4 flex justify-between';
                    
                    // Get course name
                    let courseName = "Unknown Course";
                    if (course === "CSC101") courseName = "Introduction to Computer Science";
                    else if (course === "MAT201") courseName = "Advanced Mathematics";
                    else if (course === "PHY101") courseName = "Physics I";
                    else if (course === "ENG202") courseName = "English Composition";
                    else if (course === "HIS101") courseName = "World History";
                    
                    // Get section time
                    let sectionTime = "Unknown Time";
                    if (section === "A") sectionTime = "MWF 9:00 AM";
                    else if (section === "B") sectionTime = "MWF 11:00 AM";
                    else if (section === "C") sectionTime = "TR 2:00 PM";
                    
                    courseElement.innerHTML = `
                        <div>
                            <h4 class="text-md font-medium">${course} - ${courseName}</h4>
                            <p class="text-sm text-gray-500">Section ${section} - ${sectionTime}</p>
                        </div>
                        <button type="button" class="text-red-500 hover:text-red-700 drop-course">Drop</button>
                    `;
                    
                    enrolledCoursesList.appendChild(courseElement);
                    
                    // Add drop course functionality
                    const dropBtn = courseElement.querySelector('.drop-course');
                    dropBtn.addEventListener('click', function() {
                        if (confirm(`Are you sure you want to drop ${course}?`)) {
                            enrolledCoursesList.removeChild(courseElement);
                            
                            // If no courses left, show form again
                            if (enrolledCoursesList.querySelectorAll('li').length === 0) {
                                enrolledCoursesSection.style.display = 'none';
                                form.closest('.max-w-md').style.display = 'block';
                            }
                        }
                    });
                });
            }
            
            // Enroll more courses
            enrollMoreBtn.addEventListener('click', function() {
                enrolledCoursesSection.style.display = 'none';
                form.closest('.max-w-md').style.display = 'block';
                
                // Remove all course entries except the first one
                const courseEntries = document.querySelectorAll('.course-entry');
                for (let i = 1; i < courseEntries.length; i++) {
                    courseContainer.removeChild(courseEntries[i]);
                }
                courseCount = 1;
            });
        });
    </script>
</body>
</html>
