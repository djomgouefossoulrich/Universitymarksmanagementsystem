<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class-wise Attendance Management</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center text-blue-800 mb-6">Class-wise Attendance Management</h1>
        
        <!-- Lecturer Info and Class Selection -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-gray-700 mb-2" for="lecturer-name">Lecturer Name</label>
                    <input type="text" id="lecturer-name" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-gray-700 mb-2" for="class-select">Select Class</label>
                    <select id="class-select" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value=""> Select Class </option>
                        <option value="cs101">CS101 - Introduction to Programming</option>
                        <option value="cs102">CS102 - Data Structures</option>
                        <option value="math201">MATH201 - Calculus</option>
                        <option value="eng101">ENG101 - English Composition</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 mb-2" for="date">Date</label>
                    <input type="date" id="attendance-date" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
        </div>
        
        <!-- Actions -->
        <div class="flex justify-between mb-6">
            <button id="load-students-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                Load Students
            </button>
            <div>
                <button id="mark-all-present" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg mr-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                    Mark All Present
                </button>
                <button id="mark-all-absent" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500">
                    Mark All Absent
                </button>
            </div>
        </div>
        
        <!-- Student List -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Student Attendance</h2>
            <div id="student-list-container" class="hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white">
                        <thead>
                            <tr class="bg-gray-200 text-gray-700">
                                <th class="py-3 px-4 text-left">Roll No.</th>
                                <th class="py-3 px-4 text-left">Student Name</th>
                                <th class="py-3 px-4 text-center">Present</th>
                                <th class="py-3 px-4 text-center">Absent</th>
                                <th class="py-3 px-4 text-left">Remarks</th>
                            </tr>
                        </thead>
                        <tbody id="student-list">
                            <!-- Student rows will be added here dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div id="no-class-selected" class="text-center py-8 text-gray-500">
                Please select a class and click "Load Students" to view the attendance form.
            </div>
        </div>
        
        <!-- Submit Button -->
        <div class="text-center">
            <button id="save-attendance-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-green-500 hidden">
                Save Attendance
            </button>
        </div>
        
        <!-- Success Message -->
        <div id="success-message" class="hidden mt-4 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative" role="alert">
            <strong class="font-bold">Success!</strong>
            <span class="block sm:inline"> Attendance has been saved successfully.</span>
        </div>
    </div>

    <script>
        // Sample student data for each class
        const classStudents = {
            'cs101': [
                { rollNo: 'CS101-001', name: 'John ' },
                { rollNo: 'CS101-002', name: 'Emma ' },
                { rollNo: 'CS101-003', name: 'Michael ' },
                { rollNo: 'CS101-004', name: 'Sophia ' },
                { rollNo: 'CS101-005', name: 'William ' },
                { rollNo: 'CS101-006', name: 'Olivia ' },
                { rollNo: 'CS101-007', name: 'James ' }
            ],
            'cs102': [
                { rollNo: 'CS102-001', name: 'Roberto ' },
                { rollNo: 'CS102-002', name: 'Patricia ' },
                { rollNo: 'CS102-003', name: 'David ' },
                { rollNo: 'CS102-004', name: ' Jackson' },
                { rollNo: 'CS102-005', name: 'Charles ' }
            ],
            'math201': [
                { rollNo: 'MATH201-001', name: 'Elizabeth ' },
                { rollNo: 'MATH201-002', name: 'Richard ' },
                { rollNo: 'MATH201-003', name: 'Susan ' },
                { rollNo: 'MATH201-004', name: 'Joseph ' },
                { rollNo: 'MATH201-005', name: 'Margaret ' },
                { rollNo: 'MATH201-006', name: 'Thomas ' }
            ],
            'eng101': [
                { rollNo: 'ENG101-001', name: 'Barbara ' },
                { rollNo: 'ENG101-002', name: ' King' },
                { rollNo: 'ENG101-003', name: 'Linda ' },
                { rollNo: 'ENG101-004', name: 'Paul ' },
                { rollNo: 'ENG101-005', name: ' Green' },
                { rollNo: 'ENG101-006', name: 'Edward ' },
                { rollNo: 'ENG101-007', name: ' Adams' },
                { rollNo: 'ENG101-008', name: ' Nelson' }
            ]
        };

        // DOM Elements
        const classSelect = document.getElementById('class-select');
        const loadStudentsBtn = document.getElementById('load-students-btn');
        const studentListContainer = document.getElementById('student-list-container');
        const noClassSelected = document.getElementById('no-class-selected');
        const studentList = document.getElementById('student-list');
        const saveAttendanceBtn = document.getElementById('save-attendance-btn');
        const markAllPresentBtn = document.getElementById('mark-all-present');
        const markAllAbsentBtn = document.getElementById('mark-all-absent');
        const successMessage = document.getElementById('success-message');
        const attendanceDate = document.getElementById('attendance-date');
        const lecturerName = document.getElementById('lecturer-name');

        // Set default date to today
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        attendanceDate.value = `${year}-${month}-${day}`;

        // Load Students Function
        loadStudentsBtn.addEventListener('click', () => {
            const selectedClass = classSelect.value;
            
            if (!selectedClass) {
                alert('Please select a class first!');
                return;
            }

            if (!lecturerName.value.trim()) {
                alert('Please enter lecturer name!');
                return;
            }

            if (!attendanceDate.value) {
                alert('Please select a date!');
                return;
            }

            // Clear previous student list
            studentList.innerHTML = '';
            
            // Get students for the selected class
            const students = classStudents[selectedClass];
            
            // Create student rows
            students.forEach((student, index) => {
                const row = document.createElement('tr');
                row.className = index % 2 === 0 ? 'bg-gray-50' : 'bg-white';
                
                row.innerHTML = `
                    <td class="py-3 px-4 border-b">${student.rollNo}</td>
                    <td class="py-3 px-4 border-b">${student.name}</td>
                    <td class="py-3 px-4 border-b text-center">
                        <input type="radio" name="attendance-${student.rollNo}" value="present" class="attendance-radio form-radio h-5 w-5 text-green-600">
                    </td>
                    <td class="py-3 px-4 border-b text-center">
                        <input type="radio" name="attendance-${student.rollNo}" value="absent" class="attendance-radio form-radio h-5 w-5 text-red-600">
                    </td>
                    <td class="py-3 px-4 border-b">
                        <input type="text" class="w-full px-2 py-1 border rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500" placeholder="Optional remarks">
                    </td>
                `;
                
                studentList.appendChild(row);
            });
            
            // Show student list and save button
            studentListContainer.classList.remove('hidden');
            noClassSelected.classList.add('hidden');
            saveAttendanceBtn.classList.remove('hidden');
        });

        // Mark All Present
        markAllPresentBtn.addEventListener('click', () => {
            const presentRadios = document.querySelectorAll('input[value="present"]');
            presentRadios.forEach(radio => {
                radio.checked = true;
            });
        });

        // Mark All Absent
        markAllAbsentBtn.addEventListener('click', () => {
            const absentRadios = document.querySelectorAll('input[value="absent"]');
            absentRadios.forEach(radio => {
                radio.checked = true;
            });
        });

        // Save Attendance
        saveAttendanceBtn.addEventListener('click', () => {
            // Check if all students have attendance marked
            const allStudentRadios = document.querySelectorAll('.attendance-radio');
            const totalStudents = allStudentRadios.length / 2; // Divide by 2 because there are 2 radios per student
            
            let markedCount = 0;
            const studentData = [];
            
            // Get all unique student IDs from the radio names
            const studentIds = new Set();
            allStudentRadios.forEach(radio => {
                const studentId = radio.name.replace('attendance-', '');
                studentIds.add(studentId);
            });
            
            // Check attendance for each student
            studentIds.forEach(studentId => {
                const radioSelected = document.querySelector(`input[name="attendance-${studentId}"]:checked`);
                if (radioSelected) {
                    markedCount++;
                    
                    // Get student info
                    const row = radioSelected.closest('tr');
                    const name = row.cells[1].textContent;
                    const remarks = row.cells[4].querySelector('input').value;
                    
                    // Store data
                    studentData.push({
                        rollNo: studentId,
                        name: name,
                        status: radioSelected.value,
                        remarks: remarks
                    });
                }
            });
            
            if (markedCount < studentIds.size) {
                alert(`Please mark attendance for all students. Currently marked: ${markedCount}/${studentIds.size}`);
                return;
            }
            
            // Here you would typically send the data to a server
            console.log('Attendance Data:', {
                lecturer: lecturerName.value,
                class: classSelect.options[classSelect.selectedIndex].text,
                date: attendanceDate.value,
                students: studentData
            });
            
            // Show success message
            successMessage.classList.remove('hidden');
            
            // Hide success message after 3 seconds
            setTimeout(() => {
                successMessage.classList.add('hidden');
            }, 3000);
        });
    </script>
</body>
</html>
